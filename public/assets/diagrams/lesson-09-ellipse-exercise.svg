<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 790" role="img" aria-labelledby="title desc">
  <title id="title">Draw each observed rim with its bowl walls</title>
  <desc id="desc">Two studies show a bowl from low and higher eye positions. Each ellipse sits on a bowl body with side walls and a base, and has its own width and height marks for comparison.</desc>
  <rect width="480" height="790" rx="20" fill="#fbf8f0"/>
  <text x="240" y="42" fill="#33413b" font-family="system-ui,sans-serif" font-size="24" font-weight="700" text-anchor="middle">Two views, two bowl studies</text>
  <text x="240" y="72" fill="#53635b" font-family="system-ui,sans-serif" font-size="17" text-anchor="middle">Keep bowl still; move only your eye height</text>
  <rect x="24" y="96" width="432" height="294" rx="15" fill="#f4f0e6"/>
  <text x="48" y="130" fill="#33413b" font-family="system-ui,sans-serif" font-size="20" font-weight="700">A · Lower view</text>
  <circle cx="65" cy="177" r="8" fill="#237680"/>
  <path d="M75 177 119 193" stroke="#237680" stroke-width="2" stroke-dasharray="5 5"/>
  <path d="M108 191 C112 226 129 253 150 265 Q170 273 190 265 C211 253 228 226 232 191 Z" fill="#f4f0e6" stroke="#33413b" stroke-width="3"/>
  <ellipse cx="170" cy="191" rx="62" ry="11" fill="#e9ddc5" stroke="#33413b" stroke-width="3"/>
  <line x1="108" y1="211" x2="232" y2="211" stroke="#bc6b4e" stroke-width="2"/>
  <line x1="240" y1="185" x2="240" y2="197" stroke="#237680" stroke-width="2"/>
  <text x="278" y="184" fill="#33413b" font-family="system-ui,sans-serif" font-size="18" font-weight="700">Measure this rim</text>
  <text x="278" y="214" fill="#53635b" font-family="system-ui,sans-serif" font-size="17">width + height</text>
  <text x="278" y="244" fill="#53635b" font-family="system-ui,sans-serif" font-size="17">Draw bowl walls</text>
  <text x="278" y="274" fill="#53635b" font-family="system-ui,sans-serif" font-size="17">Compare with life</text>
  <text x="170" y="356" fill="#33413b" font-family="system-ui,sans-serif" font-size="17" text-anchor="middle">near rim height · flatter ellipse</text>
  <rect x="24" y="406" width="432" height="294" rx="15" fill="#f4f0e6"/>
  <text x="48" y="440" fill="#33413b" font-family="system-ui,sans-serif" font-size="20" font-weight="700">B · Higher view</text>
  <circle cx="65" cy="487" r="8" fill="#237680"/>
  <path d="M75 487 119 521" stroke="#237680" stroke-width="2" stroke-dasharray="5 5"/>
  <path d="M110 501 C114 538 131 566 151 577 Q170 585 189 577 C209 566 226 538 230 501 Z" fill="#f4f0e6" stroke="#33413b" stroke-width="3"/>
  <ellipse cx="170" cy="501" rx="60" ry="29" fill="#e9ddc5" stroke="#33413b" stroke-width="3"/>
  <line x1="110" y1="539" x2="230" y2="539" stroke="#bc6b4e" stroke-width="2"/>
  <line x1="250" y1="472" x2="250" y2="530" stroke="#237680" stroke-width="2"/>
  <text x="278" y="494" fill="#33413b" font-family="system-ui,sans-serif" font-size="18" font-weight="700">Measure again</text>
  <text x="278" y="524" fill="#53635b" font-family="system-ui,sans-serif" font-size="17">its own width</text>
  <text x="278" y="554" fill="#53635b" font-family="system-ui,sans-serif" font-size="17">and ellipse height</text>
  <text x="278" y="584" fill="#53635b" font-family="system-ui,sans-serif" font-size="17">Draw the bowl body</text>
  <text x="170" y="668" fill="#33413b" font-family="system-ui,sans-serif" font-size="17" text-anchor="middle">higher eye · more open ellipse</text>
  <text x="240" y="744" fill="#53635b" font-family="system-ui,sans-serif" font-size="17" text-anchor="middle">Compare each rim to its own width; widths may differ.</text>
</svg>
