<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1000" role="img" aria-labelledby="title desc"><title id="title">Follow the contour</title><desc id="desc">A simple side-view shoe outline has a highlighted outer edge and three labeled direction changes at the toe, sole, and collar.</desc><rect class="bg" width="720" height="1000"/><style>text{font-family:Arial,Helvetica,sans-serif;fill:#263238}.bg{fill:#faf8f2}.panel{fill:#fff;stroke:#d8d3c9;stroke-width:2}.title{font-size:42px;font-weight:700}.subtitle{font-size:25px;fill:#505c62}.heading{font-size:29px;font-weight:700}.body{font-size:25px}.small{font-size:22px}.tag{font-size:22px;font-weight:700;letter-spacing:1px;fill:#087064}.ink{fill:none;stroke:#30383c;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}.thin{fill:none;stroke:#58646a;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.ghost{fill:none;stroke:#929b9b;stroke-width:4;stroke-dasharray:9 9;stroke-linecap:round;stroke-linejoin:round}.accent{fill:none;stroke:#087064;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}.accentFill{fill:#d8efea;stroke:#087064;stroke-width:3}.warn{fill:none;stroke:#b7472c;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}.warnFill{fill:#f7e2da;stroke:#b7472c;stroke-width:3}.soft{fill:#eef0ed;stroke:#536168;stroke-width:3}.rule{stroke:#d8d3c9;stroke-width:2}.footer{font-size:21px;fill:#58646a}</style><text x="38" y="58" class="title">Follow the contour</text><text x="40" y="101" class="subtitle">Notice the turns in order.</text><rect x="32" y="137" width="656" height="545" rx="18" class="panel"/><text x="58" y="180" class="heading">The outside edge is a sequence</text><g transform="translate(165 245) scale(1.65 1.65)" class="ink"><path d="M18 115 C13 93 23 70 32 47 L44 19 C50 5 69 14 76 31 L92 72 C111 91 156 105 195 110 C217 112 229 126 216 141 C211 152 196 156 177 155 L22 155 C6 154 1 143 8 132 Z"/><path d="M17 130 C68 136 145 132 207 137"/><path d="M44 36 L70 47 M47 47 L73 57 M51 58 L77 67" class="thin"/></g><g transform="translate(165 245) scale(1.65 1.65)"><path d="M44 19 C37 34 26 62 18 92" class="accent"/><path d="M92 72 C111 91 156 105 195 110" class="accent"/><path d="M18 115 C13 123 8 129 8 132" class="accent"/><circle cx="44" cy="19" r="8" class="accentFill"/><circle cx="92" cy="72" r="8" class="accentFill"/><circle cx="195" cy="110" r="8" class="accentFill"/></g><text x="70" y="617" class="tag">COLLAR</text><text x="292" y="617" class="tag">SOLE FLATTENS</text><text x="520" y="617" class="tag">TOE TURNS</text><path d="M142 592 L192 532 M363 592 L326 477 M554 592 L519 432" class="thin"/>
<rect x="32" y="704" width="656" height="188" rx="18" class="panel"/><text x="58" y="750" class="heading">Pause, look back, continue</text><text x="58" y="798" class="body">Outer contour first. Add seams after.</text><text x="58" y="842" class="body">A turn you can point to beats a guessed outline.</text><text x="40" y="970" class="footer">Schematic shoe: observe your own shoe.</text></svg>