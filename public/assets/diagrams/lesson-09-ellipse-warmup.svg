<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 750" role="img" aria-labelledby="title desc">
  <title id="title">Three quick views of one bowl rim</title>
  <desc id="desc">A bowl remains fixed while eye height rises from low to high. Schematic normalized ellipses become more open; each warm-up sketch should also measure the actual width from that view.</desc>
  <rect width="480" height="750" rx="20" fill="#fbf8f0"/>
  <text x="240" y="43" fill="#33413b" font-family="system-ui,sans-serif" font-size="25" font-weight="700" text-anchor="middle">Seven-minute eye-height warm-up</text>
  <text x="240" y="76" fill="#53635b" font-family="system-ui,sans-serif" font-size="18" text-anchor="middle">Keep bowl and horizontal viewing spot fixed</text>

  <g transform="translate(0 0)">
    <rect x="24" y="105" width="432" height="175" rx="14" fill="#f4f0e6"/>
    <text x="48" y="143" fill="#33413b" font-family="system-ui,sans-serif" font-size="21" font-weight="700">1 · Low eye</text>
    <path d="M67 183h120" stroke="#237680" stroke-width="3" stroke-dasharray="7 6"/>
    <circle cx="72" cy="183" r="9" fill="#237680"/>
    <path d="M158 184q38 5 50 28q-12 20-50 24q-38-4-50-24q12-23 50-28z" fill="#e9ddc5" stroke="#33413b" stroke-width="3"/>
    <ellipse cx="316" cy="205" rx="74" ry="12" fill="#e9ddc5" stroke="#33413b" stroke-width="3"/>
    <line x1="242" y1="240" x2="390" y2="240" stroke="#bc6b4e" stroke-width="2"/>
    <text x="316" y="267" fill="#53635b" font-family="system-ui,sans-serif" font-size="18" text-anchor="middle">flatter sketch</text>
  </g>
  <g transform="translate(0 187)">
    <rect x="24" y="105" width="432" height="175" rx="14" fill="#f4f0e6"/>
    <text x="48" y="143" fill="#33413b" font-family="system-ui,sans-serif" font-size="21" font-weight="700">2 · Mid-height eye</text>
    <path d="M67 196h120" stroke="#237680" stroke-width="3" stroke-dasharray="7 6"/>
    <circle cx="72" cy="196" r="9" fill="#237680"/>
    <path d="M158 184q38 5 50 28q-12 20-50 24q-38-4-50-24q12-23 50-28z" fill="#e9ddc5" stroke="#33413b" stroke-width="3"/>
    <ellipse cx="316" cy="205" rx="74" ry="25" fill="#e9ddc5" stroke="#33413b" stroke-width="3"/>
    <line x1="242" y1="240" x2="390" y2="240" stroke="#bc6b4e" stroke-width="2"/>
    <text x="316" y="267" fill="#53635b" font-family="system-ui,sans-serif" font-size="18" text-anchor="middle">more open sketch</text>
  </g>
  <g transform="translate(0 374)">
    <rect x="24" y="105" width="432" height="175" rx="14" fill="#f4f0e6"/>
    <text x="48" y="143" fill="#33413b" font-family="system-ui,sans-serif" font-size="21" font-weight="700">3 · High eye</text>
    <path d="M67 168h120" stroke="#237680" stroke-width="3" stroke-dasharray="7 6"/>
    <circle cx="72" cy="168" r="9" fill="#237680"/>
    <path d="M158 184q38 5 50 28q-12 20-50 24q-38-4-50-24q12-23 50-28z" fill="#e9ddc5" stroke="#33413b" stroke-width="3"/>
    <ellipse cx="316" cy="205" rx="74" ry="39" fill="#e9ddc5" stroke="#33413b" stroke-width="3"/>
    <line x1="242" y1="240" x2="390" y2="240" stroke="#bc6b4e" stroke-width="2"/>
    <text x="316" y="267" fill="#53635b" font-family="system-ui,sans-serif" font-size="18" text-anchor="middle">most open here</text>
  </g>
  <text x="240" y="688" fill="#33413b" font-family="system-ui,sans-serif" font-size="19" font-weight="700" text-anchor="middle">Sketch each opening; measure its own width.</text>
  <text x="240" y="718" fill="#53635b" font-family="system-ui,sans-serif" font-size="17" text-anchor="middle">Oval widths are normalized in this guide only.</text>
</svg>
