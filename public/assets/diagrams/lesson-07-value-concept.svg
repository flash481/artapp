<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 610" role="img" aria-labelledby="title desc">
  <title id="title">Three broad value families on fruit</title>
  <desc id="desc">An upper-left lamp illuminates a round fruit. A broad light area, middle turning plane, and dark form shadow are visible, with a separate cast shadow extending right across the table.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10z" fill="#237680"/></marker>
    <clipPath id="fruitClip"><path d="M270 207c-44-38-127-13-131 71-4 77 48 126 127 120 84 6 138-44 134-120-4-84-87-109-130-71z"/></clipPath>
  </defs>
  <rect width="480" height="610" rx="20" fill="#fbf8f0"/>
  <text x="240" y="42" fill="#33413b" font-family="system-ui,sans-serif" font-size="25" font-weight="700" text-anchor="middle">Squint for broad groups</text>
  <text x="240" y="72" fill="#53635b" font-family="system-ui,sans-serif" font-size="18" text-anchor="middle">Lamp upper left · fruit from life</text>
  <circle cx="57" cy="145" r="24" fill="#f1d58f" stroke="#33413b" stroke-width="3"/>
  <text x="57" y="187" fill="#33413b" font-family="system-ui,sans-serif" font-size="18" text-anchor="middle">lamp</text>
  <path d="M80 156 158 206" fill="none" stroke="#237680" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M271 181c-30-20-58-15-80-3 19 1 34 7 48 15 15-8 33-14 52-11-5-10-12-15-20-17z" fill="#665748"/>
  <ellipse cx="352" cy="410" rx="86" ry="11" fill="#58493d"/>
  <path d="M270 207c-44-38-127-13-131 71-4 77 48 126 127 120 84 6 138-44 134-120-4-84-87-109-130-71z" fill="#c19b68" stroke="#33413b" stroke-width="4"/>
  <path d="M263 207c-39-27-89-17-109 15-18 29-15 65-1 92 14-28 32-46 54-59 23-13 42-27 56-48z" fill="#f4efdd"/>
  <path d="M302 250c38-22 78-8 91 26 14 34 10 73-8 102-16 24-41 38-70 43 17-35 20-71 11-103-7-28-16-49-24-68z" fill="#58493d" clip-path="url(#fruitClip)"/>
  <path d="M270 199v191" stroke="#33413b" stroke-width="2" stroke-dasharray="7 8" opacity=".4"/>
  <text x="184" y="294" fill="#33413b" font-family="system-ui,sans-serif" font-size="17" font-weight="700" text-anchor="middle">LIGHT</text>
  <text x="260" y="342" fill="#33413b" font-family="system-ui,sans-serif" font-size="17" font-weight="700" text-anchor="middle">MIDDLE</text>
  <text x="347" y="331" fill="#fff" font-family="system-ui,sans-serif" font-size="17" font-weight="700" text-anchor="middle">DARK</text>
  <text x="352" y="414" fill="#fff" font-family="system-ui,sans-serif" font-size="15" font-weight="700" text-anchor="middle">cast shadow</text>
  <text x="240" y="471" fill="#33413b" font-family="system-ui,sans-serif" font-size="18" text-anchor="middle">Form shadow turns fruit.</text>
  <text x="240" y="499" fill="#33413b" font-family="system-ui,sans-serif" font-size="18" text-anchor="middle">Cast shadow rests on table.</text>
  <rect x="54" y="535" width="105" height="38" rx="6" fill="#f4efdd" stroke="#33413b" stroke-width="2"/>
  <rect x="188" y="535" width="105" height="38" rx="6" fill="#c19b68" stroke="#33413b" stroke-width="2"/>
  <rect x="321" y="535" width="105" height="38" rx="6" fill="#58493d" stroke="#33413b" stroke-width="2"/>
  <text x="106" y="560" fill="#33413b" font-family="system-ui,sans-serif" font-size="17" font-weight="700" text-anchor="middle">light</text>
  <text x="240" y="560" fill="#33413b" font-family="system-ui,sans-serif" font-size="17" font-weight="700" text-anchor="middle">middle</text>
  <text x="373" y="560" fill="#fff" font-family="system-ui,sans-serif" font-size="17" font-weight="700" text-anchor="middle">dark</text>
</svg>
