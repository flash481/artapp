<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 540" role="img" aria-labelledby="title desc">
<title id="title">One edge, three pressures</title>
<desc id="desc">A small book corner sits above three repeated graphite strokes labeled light, medium, and firm, showing pressure changes darkness and width without changing the line's direction.</desc>
<defs>
  <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#ad6847" stroke-width="1.5"/></marker>
  <style>
    .ink{fill:none;stroke:#37413b;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
    .light{fill:none;stroke:#9a9b8b;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
    .guide{fill:none;stroke:#829185;stroke-width:1.4;stroke-dasharray:5 5;stroke-linecap:round}
    .accent{fill:none;stroke:#ad6847;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
    .heavy{fill:none;stroke:#37413b;stroke-width:4.2;stroke-linecap:round;stroke-linejoin:round}
    .soft{fill:#f1eee5;stroke:#d9d4c8;stroke-width:1}
    .card{fill:#fffdf8;stroke:#d9d4c8;stroke-width:1.2}
    .head{font:700 23px Arial,sans-serif;fill:#303a34}
    .sub{font:15px Arial,sans-serif;fill:#59655d}
    .label{font:700 16px Arial,sans-serif;fill:#38433c}
    .body{font:15px Arial,sans-serif;fill:#465149}
    .small{font:14px Arial,sans-serif;fill:#59655d}
    .accentText{font:700 15px Arial,sans-serif;fill:#925638}
    .number{font:700 15px Arial,sans-serif;fill:#fffdf8}
  </style>
</defs>
<rect width="390" height="540" rx="18" fill="#fbf8f1"/>
<text class="head" x="18" y="34">One edge, three pressures</text>
<text class="sub" x="18" y="59">Same edge, three pressures.</text>
<rect class="card" x="15" y="83" width="360" height="152" rx="12"/>
<text class="label" x="29" y="111">Choose one real edge</text>
<path class="light" d="M119 142 L265 127 L271 209 L125 222 Z"/>
<path class="ink" d="M119 142 L265 127 L271 209"/>
<path class="light" d="M124 151 L259 137 M127 160 L261 148"/>
<path class="accent" marker-end="url(#arrow)" d="M83 174 L116 146"/>
<text class="small" x="29" y="230">From life</text>
<rect class="card" x="15" y="247" width="360" height="200" rx="12"/>
<text class="label" x="29" y="275">Repeat the same direction</text>
<path class="light" d="M57 316 L178 306"/><text class="body" x="204" y="321">light — provisional</text>
<path class="ink" d="M57 359 L178 349"/><text class="body" x="204" y="364">medium — visible</text>
<path class="heavy" d="M57 404 L178 394"/><text class="body" x="204" y="409">firm — chosen emphasis</text>
<text class="small" x="29" y="434">Same direction, varied pressure.</text>
<rect x="22" y="464" width="346" height="48" rx="10" fill="#eef0e9"/>
<text class="label" x="34" y="494">Notice which stroke is easiest to revise.</text>
</svg>
