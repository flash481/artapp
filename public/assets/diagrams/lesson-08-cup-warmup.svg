<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 680" role="img" aria-labelledby="title desc">
  <title id="title">Warm up with a cylinder, then compare a cup</title>
  <desc id="desc">A seven-minute sequence constructs a light cylinder guide with an axis and ellipses, then compares it with a handled cup whose sides may taper.</desc>
  <rect width="480" height="680" rx="20" fill="#fbf8f0"/>
  <text x="240" y="42" fill="#33413b" font-family="system-ui,sans-serif" font-size="24" font-weight="700" text-anchor="middle">Seven-minute volume warm-up</text>
  <text x="240" y="72" fill="#53635b" font-family="system-ui,sans-serif" font-size="18" text-anchor="middle">Keep your real cup in one place</text>
  <rect x="24" y="96" width="432" height="245" rx="15" fill="#f4f0e6"/>
  <text x="48" y="132" fill="#33413b" font-family="system-ui,sans-serif" font-size="20" font-weight="700">1 · Draw a cylinder guide</text>
  <ellipse cx="142" cy="202" rx="48" ry="16" fill="#fbf8f0" stroke="#33413b" stroke-width="3"/>
  <path d="M94 202v83 M190 202v83 M94 285a48 16 0 0 0 96 0" fill="none" stroke="#33413b" stroke-width="3"/>
  <path d="M142 180v124" stroke="#237680" stroke-width="3" stroke-dasharray="7 7"/>
  <line x1="94" y1="317" x2="190" y2="317" stroke="#bc6b4e" stroke-width="2"/>
  <text x="258" y="190" fill="#33413b" font-family="system-ui,sans-serif" font-size="19">Center axis</text>
  <text x="258" y="221" fill="#33413b" font-family="system-ui,sans-serif" font-size="19">Top + base oval</text>
  <text x="258" y="252" fill="#53635b" font-family="system-ui,sans-serif" font-size="18">Keep guides light</text>
  <text x="258" y="283" fill="#53635b" font-family="system-ui,sans-serif" font-size="18">for easy changes</text>
  <rect x="24" y="357" width="432" height="278" rx="15" fill="#f4f0e6"/>
  <text x="48" y="393" fill="#33413b" font-family="system-ui,sans-serif" font-size="20" font-weight="700">2 · Check against your cup</text>
  <ellipse cx="139" cy="455" rx="48" ry="16" fill="#fbf8f0" stroke="#33413b" stroke-width="3"/>
  <path d="M91 455 104 554 M187 455 174 554 M104 554a35 12 0 0 0 70 0" fill="none" stroke="#33413b" stroke-width="3"/>
  <path d="M187 466c53-10 61 51 1 53" fill="none" stroke="#8e9d91" stroke-width="10" stroke-linecap="round"/>
  <path d="M187 466c53-10 61 51 1 53" fill="none" stroke="#33413b" stroke-width="3" stroke-linecap="round"/>
  <path d="M242 495h24" stroke="#237680" stroke-width="3"/>
  <text x="286" y="452" fill="#33413b" font-family="system-ui,sans-serif" font-size="18" font-weight="700">Observe:</text>
  <text x="286" y="481" fill="#53635b" font-family="system-ui,sans-serif" font-size="18">taper or straight?</text>
  <text x="286" y="510" fill="#53635b" font-family="system-ui,sans-serif" font-size="18">Handle angle?</text>
  <text x="286" y="539" fill="#53635b" font-family="system-ui,sans-serif" font-size="18">Rim opening?</text>
  <text x="240" y="601" fill="#53635b" font-family="system-ui,sans-serif" font-size="18" text-anchor="middle">Revise the guide to match the object.</text>
</svg>
