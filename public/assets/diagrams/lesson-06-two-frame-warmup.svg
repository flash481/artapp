<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 540" role="img" aria-labelledby="title desc">
<title id="title">Two frames, same still life</title>
<desc id="desc">Two small frames show one fixed mug-and-book arrangement, first with generous margins and then cropped closer. The object shapes stay simple and slightly uneven.</desc>
<defs>
  <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#ad6847" stroke-width="1.5"/></marker>
  <style>
    .ink{fill:none;stroke:#37413b;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
    .light{fill:none;stroke:#9a9b8b;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
    .guide{fill:none;stroke:#829185;stroke-width:1.4;stroke-dasharray:5 5;stroke-linecap:round}
    .accent{fill:none;stroke:#ad6847;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
    .heavy{fill:none;stroke:#37413b;stroke-width:4.2;stroke-linecap:round;stroke-linejoin:round}
    .soft{fill:#f1eee5;stroke:#d9d4c8;stroke-width:1}
    .card{fill:#fffdf8;stroke:#d9d4c8;stroke-width:1.2}
    .head{font:700 23px Arial,sans-serif;fill:#303a34}
    .sub{font:15px Arial,sans-serif;fill:#59655d}
    .label{font:700 16px Arial,sans-serif;fill:#38433c}
    .body{font:15px Arial,sans-serif;fill:#465149}
    .small{font:14px Arial,sans-serif;fill:#59655d}
    .accentText{font:700 15px Arial,sans-serif;fill:#925638}
    .number{font:700 15px Arial,sans-serif;fill:#fffdf8}
  </style>
</defs>
<rect width="390" height="540" rx="18" fill="#fbf8f1"/>
<text class="head" x="18" y="34">Two frames, same still life</text>
<text class="sub" x="18" y="59">Change the frame; hold the arrangement.</text>
<rect class="card" x="15" y="83" width="360" height="173" rx="12"/>
<text class="label" x="29" y="111">Frame 1  generous margin</text>
<rect x="34" y="126" width="322" height="108" fill="#f4f1e9" stroke="#829185" stroke-width="1.6"/>
<path class="ink" d="M82 155 Q66 159 68 185 L73 216 L124 216 L129 182 Q127 159 106 155Z M78 160 Q101 149 119 160"/>
<path class="ink" d="M128 171 C153 159 157 207 124 199"/>
<path class="ink" d="M185 148 L300 148 L300 215 L185 215 Z M195 155 L292 155"/>
<text class="small" x="29" y="250">Notice the open spaces around the forms.</text>
<rect class="card" x="15" y="269" width="360" height="181" rx="12"/>
<text class="label" x="29" y="297">Frame 2  closer crop</text>
<rect x="34" y="312" width="322" height="102" fill="#f4f1e9" stroke="#829185" stroke-width="1.6"/>
<path class="ink" d="M52 327 Q31 331 33 360 L39 406 L102 406 L108 356 Q106 331 82 327Z M48 331 Q77 319 97 332"/>
<path class="ink" d="M106 349 C137 331 143 403 101 387"/>
<path class="ink" d="M163 322 L335 322 L335 405 L163 405 Z M174 331 L324 331"/>
<path class="guide" d="M145 346 Q151 353 158 345"/>
<text class="small" x="29" y="439">Keep the viewpoint; then reduce the margin.</text>
<rect x="22" y="462" width="346" height="49" rx="10" fill="#eef0e9"/>
<text class="label" x="34" y="492">Two quick choices, not finished drawings.</text>
</svg>
