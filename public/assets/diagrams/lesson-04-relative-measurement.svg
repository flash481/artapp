<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 540" role="img" aria-labelledby="title desc">
<title id="title">Compare observed parts</title>
<desc id="desc">An irregular flower is blocked in with a tilted axis. A horizontal arrow marks the bloom width as one temporary unit; another checks stem length, while gaps and leaf alignments remain visible. In the bottom schematic the eye, shoulder, straight extended arm, gripping hand, and pencil share one view line; a thumb marks a comparison unit. Repeat from the same viewpoint and arm reach.</desc>
<defs>
  <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#ad6847" stroke-width="1.5"/></marker>
  <style>
    .ink{fill:none;stroke:#37413b;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
    .light{fill:none;stroke:#9a9b8b;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
    .guide{fill:none;stroke:#829185;stroke-width:1.4;stroke-dasharray:5 5;stroke-linecap:round}
    .accent{fill:none;stroke:#ad6847;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
    .heavy{fill:none;stroke:#37413b;stroke-width:4.2;stroke-linecap:round;stroke-linejoin:round}
    .soft{fill:#f1eee5;stroke:#d9d4c8;stroke-width:1}
    .card{fill:#fffdf8;stroke:#d9d4c8;stroke-width:1.2}
    .head{font:700 23px Arial,sans-serif;fill:#303a34}
    .sub{font:15px Arial,sans-serif;fill:#59655d}
    .label{font:700 16px Arial,sans-serif;fill:#38433c}
    .body{font:15px Arial,sans-serif;fill:#465149}
    .small{font:14px Arial,sans-serif;fill:#59655d}
    .accentText{font:700 15px Arial,sans-serif;fill:#925638}
    .number{font:700 15px Arial,sans-serif;fill:#fffdf8}
  </style>
</defs>
<rect width="390" height="540" rx="18" fill="#fbf8f1"/>
<text class="head" x="18" y="34">Compare observed parts</text>
<text class="sub" x="18" y="59">Measure this flower, not a fixed ratio.</text>
<rect class="card" x="12" y="78" width="366" height="365" rx="13"/>
<text class="label" x="27" y="106">One observed flower, checked in parts</text>
<path class="guide" d="M188 145 L205 361"/>
<path class="light" d="M191 153 C187 188 194 211 194 238 M198 276 C201 309 202 330 206 355"/>
<path class="ink" d="M194 238 C188 280 198 321 206 356 C211 374 219 390 225 406"/>
<path class="ink" d="M198 306 C172 287 156 291 147 308 C166 313 184 316 200 323"/>
<path class="light" d="M201 325 C180 313 163 307 149 307"/>
<path class="ink" d="M202 338 C228 319 248 318 264 331 C248 339 228 345 205 351"/>
<path class="light" d="M206 345 C225 337 245 332 261 331"/>
<path class="ink" d="M194 238 C177 227 155 222 143 208 C132 195 138 179 152 177 C156 158 175 152 189 164 C201 148 222 156 225 174 C246 178 251 195 237 210 C226 224 211 233 194 238Z"/>
<path class="light" d="M194 238 C190 220 179 202 181 185 C183 171 193 164 202 172 C213 178 212 196 204 211 C200 222 197 231 194 238Z"/>
<path class="ink" d="M143 208 Q159 206 173 199 M152 177 Q163 185 176 190 M189 164 Q188 177 190 187 M225 174 Q215 184 208 194 M237 210 Q221 207 211 201"/>
<path class="accent" marker-start="url(#arrow)" marker-end="url(#arrow)" d="M137 129 L243 129"/>
<path class="accent" d="M137 134 L137 155 M243 134 L243 155"/>
<text class="accentText" x="156" y="122">bloom width = 1 unit</text>
<path class="guide" d="M283 239 L283 355"/>
<path class="accent" d="M276 239 L290 239 M276 355 L290 355"/>
<text class="small" x="294" y="278">compare</text><text class="small" x="294" y="296">stem length</text>
<path class="accent" marker-end="url(#arrow)" d="M280 304 C254 304 238 305 223 313"/>
<text class="small" x="28" y="267">check stem tilt</text>
<path class="accent" marker-end="url(#arrow)" d="M151 270 L180 274"/>
<text class="small" x="28" y="350">compare leaf</text><text class="small" x="28" y="368">attachment</text>
<path class="accent" marker-end="url(#arrow)" d="M125 354 L177 319"/>
<path class="light" d="M84 391 C103 383 121 386 136 398 M267 382 C282 375 299 380 309 393"/>
<text class="small" x="74" y="419">Notice the open gaps too</text>
<rect x="18" y="450" width="354" height="78" rx="10" fill="#eef0e9"/>
<text class="label" x="28" y="472">Sighting: repeat the same straight reach.</text>
<ellipse class="ink" cx="48" cy="495" rx="14" ry="8"/><circle cx="48" cy="495" r="3.5" fill="#37413b"/>
<path class="guide" d="M62 495 L360 487"/>
