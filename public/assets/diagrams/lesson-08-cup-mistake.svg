<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 650" role="img" aria-labelledby="title desc">
  <title id="title">Let the observed cup change the construction</title>
  <desc id="desc">A forced vertical cylinder and guessed handle are compared with a tapered observed cup. The checked version uses the seen rim and two attachment points.</desc>
  <rect width="480" height="650" rx="20" fill="#fbf8f0"/>
  <text x="240" y="42" fill="#33413b" font-family="system-ui,sans-serif" font-size="24" font-weight="700" text-anchor="middle">Construction is a first guess</text>
  <rect x="24" y="66" width="432" height="235" rx="15" fill="#f4f0e6"/>
  <text x="48" y="102" fill="#a04f39" font-family="system-ui,sans-serif" font-size="20" font-weight="700">FORCED CYLINDER</text>
  <ellipse cx="142" cy="166" rx="42" ry="14" fill="#fbf8f0" stroke="#33413b" stroke-width="3"/>
  <path d="M100 166v90 M184 166v90 M100 256a42 12 0 0 0 84 0" fill="none" stroke="#33413b" stroke-width="3"/>
  <path d="M184 180c55-12 57 64 0 62" fill="none" stroke="#33413b" stroke-width="9" stroke-linecap="round"/>
  <text x="265" y="160" fill="#33413b" font-family="system-ui,sans-serif" font-size="17">Straight sides</text>
  <text x="265" y="190" fill="#33413b" font-family="system-ui,sans-serif" font-size="17">guessed loop</text>
  <text x="265" y="220" fill="#53635b" font-family="system-ui,sans-serif" font-size="17">may miss your</text>
  <text x="265" y="250" fill="#53635b" font-family="system-ui,sans-serif" font-size="17">cup's shape.</text>
  <rect x="24" y="319" width="432" height="248" rx="15" fill="#f4f0e6"/>
  <text x="48" y="355" fill="#237680" font-family="system-ui,sans-serif" font-size="20" font-weight="700">CHECKED FROM LIFE</text>
  <ellipse cx="139" cy="415" rx="39" ry="13" fill="#fbf8f0" stroke="#33413b" stroke-width="3"/>
  <path d="M100 415 111 515 M178 415 167 515 M111 515a28 9 0 0 0 56 0" fill="none" stroke="#33413b" stroke-width="3"/>
  <line x1="139" y1="396" x2="139" y2="531" stroke="#237680" stroke-width="2" stroke-dasharray="6 6"/>
  <path d="M178 426c46-9 49 43 0 44" fill="none" stroke="#33413b" stroke-width="10" stroke-linecap="round"/>
  <circle cx="178" cy="426" r="5" fill="#bc6b4e"/><circle cx="178" cy="470" r="5" fill="#bc6b4e"/>
  <text x="245" y="424" fill="#33413b" font-family="system-ui,sans-serif" font-size="17">Match taper</text>
  <text x="245" y="454" fill="#33413b" font-family="system-ui,sans-serif" font-size="17">Check rim view</text>
  <text x="245" y="484" fill="#33413b" font-family="system-ui,sans-serif" font-size="17">Place both joins</text>
  <text x="245" y="514" fill="#33413b" font-family="system-ui,sans-serif" font-size="17">to the cup</text>
  <text x="240" y="610" fill="#53635b" font-family="system-ui,sans-serif" font-size="18" text-anchor="middle">Revise guides before darkening edges.</text>
</svg>
