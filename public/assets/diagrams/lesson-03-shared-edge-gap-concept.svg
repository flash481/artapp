<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1000" role="img" aria-labelledby="title desc"><title id="title">Gaps shape the plant</title><desc id="desc">A potted plant diagram marks three distinct cyan negative-space shapes between its leaves. Matching A, B, and C labels link each opening to an enlarged example that can be compared by width, angle, and position.</desc><rect class="bg" width="720" height="1000"/><style>text{font-family:Arial,Helvetica,sans-serif;fill:#263238}.bg{fill:#faf8f2}.panel{fill:#fff;stroke:#d8d3c9;stroke-width:2}.title{font-size:42px;font-weight:700}.subtitle{font-size:25px;fill:#505c62}.heading{font-size:29px;font-weight:700}.body{font-size:25px}.small{font-size:22px}.tag{font-size:22px;font-weight:700;letter-spacing:1px;fill:#087064}.ink{fill:none;stroke:#30383c;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}.thin{fill:none;stroke:#58646a;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.accent{fill:none;stroke:#087064;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}.accentFill{fill:#d8efea;stroke:#087064;stroke-width:3}.leaf{fill:#e7ede6;stroke:#30383c;stroke-width:4;stroke-linejoin:round}.footer{font-size:21px;fill:#58646a}</style><text x="38" y="58" class="title">Gaps shape the plant</text><text x="40" y="101" class="subtitle">A gap shares an edge.</text><rect x="32" y="137" width="656" height="572" rx="18" class="panel"/><text x="58" y="180" class="heading">The plant and its gaps fit together</text>
