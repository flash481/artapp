<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1000" role="img" aria-labelledby="title desc"><title id="title">Do not lose the gaps</title><desc id="desc">Repeated leaf symbols crowd the first plant sketch and make openings vanish. A second sketch leaves distinct highlighted gaps between leaves, which can be compared with the real plant.</desc><rect class="bg" width="720" height="1000"/><style>text{font-family:Arial,Helvetica,sans-serif;fill:#263238}.bg{fill:#faf8f2}.panel{fill:#fff;stroke:#d8d3c9;stroke-width:2}.title{font-size:42px;font-weight:700}.subtitle{font-size:25px;fill:#505c62}.heading{font-size:29px;font-weight:700}.body{font-size:25px}.small{font-size:22px}.tag{font-size:22px;font-weight:700;letter-spacing:1px;fill:#087064}.ink{fill:none;stroke:#30383c;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}.thin{fill:none;stroke:#58646a;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.ghost{fill:none;stroke:#929b9b;stroke-width:4;stroke-dasharray:9 9;stroke-linecap:round;stroke-linejoin:round}.accent{fill:none;stroke:#087064;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}.accentFill{fill:#d8efea;stroke:#087064;stroke-width:3}.warn{fill:none;stroke:#b7472c;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}.warnFill{fill:#f7e2da;stroke:#b7472c;stroke-width:3}.soft{fill:#eef0ed;stroke:#536168;stroke-width:3}.leaf{fill:#e7ede6;stroke:#30383c;stroke-width:4;stroke-linejoin:round}.footer{font-size:21px;fill:#58646a}</style><text x="38" y="58" class="title">Do not lose the gaps</text><text x="40" y="101" class="subtitle">Check spaces, not leaf symbols.</text><rect x="32" y="145" width="316" height="568" rx="18" class="panel"/><text x="54" y="190" class="tag" style="fill:#b7472c">LEAF SYMBOLS</text><g transform="translate(87 280) scale(.9)"><path d="M30 205 Q10 150 38 107 Q70 132 45 205 M62 205 Q40 145 74 100 Q99 135 77 205 M94 205 Q77 144 110 103 Q137 139 108 205 M126 205 Q111 145 144 109 Q169 150 140 205" class="leaf"/><path d="M18 216 L156 216 L146 270 L30 270 Z" class="ink"/><path d="M87 216 L87 96 M87 217 L40 125 M87 217 L110 124" class="thin"/></g><text x="54" y="548" class="body">Openings shrink or</text><text x="54" y="588" class="body">repeat by habit.</text><text x="54" y="640" class="small">Edges crowd together.</text>
<rect x="372" y="145" width="316" height="568" rx="18" class="panel"/><text x="394" y="190" class="tag">CHECK THE GAPS</text><g transform="translate(414 272) scale(0.79)"><path d="M151 245 C148 190 145 98 149 25 M151 245 C136 207 83 156 22 121 M151 245 C126 218 76 206 26 198 M152 244 C171 207 218 166 278 148 M152 244 C185 218 234 205 272 198" class="thin"/><path d="M149 20 C122 82 126 179 149 242 C173 177 178 82 149 20 Z" class="leaf"/><path d="M145 229 C94 215 47 171 22 121 C77 128 123 175 151 236 Z" class="leaf"/><path d="M146 232 C101 218 55 219 26 198 C51 171 104 183 151 234 Z" class="leaf"/><path d="M157 232 C186 176 232 145 278 148 C261 196 213 224 153 240 Z" class="leaf"/><path d="M156 235 C204 181 248 173 272 198 C243 221 205 220 154 242 Z" class="leaf"/><path d="M119 150 C130 145 138 136 142 126 C143 148 146 166 153 185 C140 174 128 163 119 150 Z" class="accentFill"/><path d="M159 160 C169 146 181 142 193 146 C185 161 176 172 159 183 Z" class="accentFill"/><path d="M111 255 L194 255 L183 322 Q153 337 122 322 Z" class="ink"/><path d="M119 272 Q152 284 188 272" class="thin"/></g><text x="394" y="548" class="body">Compare one opening</text><text x="394" y="588" class="body">before adjusting leaves.</text><text x="394" y="640" class="small">Gaps vary with the plant.</text>
<rect x="32" y="741" width="656" height="151" rx="18" class="panel"/><text x="58" y="789" class="heading">Look for spaces that disappear</text><text x="58" y="839" class="body">Each gap should match the opening you can see.</text><text x="40" y="970" class="footer">The plant sketches are schematic examples.</text></svg>