  <path d="M302 137h65c30 0 30 74 0 74h-65" fill="none" stroke="#38463f" stroke-width="5"/>
  <path d="M417 112l137 17v126H417z" fill="#eee5d5" stroke="#38463f" stroke-width="5"/>
  <path d="M302 118h115v119H302zM88 106h44v149H88zM367 137h50v74h-50zM554 129h22v126h-22z" fill="#cfe2e3" opacity=".85"/>
