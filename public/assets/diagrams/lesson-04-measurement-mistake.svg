<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 540" role="img" aria-labelledby="title desc">
<title id="title">Let the flower vary</title>
<desc id="desc">Two flower studies contrast a memory-based flower with identical petals and a straight stem against an imperfect observed flower with a tilted axis, unequal petals, checked width, and asymmetric leaves.</desc>
<defs>
  <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#ad6847" stroke-width="1.5"/></marker>
  <style>
    .ink{fill:none;stroke:#37413b;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
    .light{fill:none;stroke:#9a9b8b;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
    .guide{fill:none;stroke:#829185;stroke-width:1.4;stroke-dasharray:5 5;stroke-linecap:round}
    .accent{fill:none;stroke:#ad6847;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
    .heavy{fill:none;stroke:#37413b;stroke-width:4.2;stroke-linecap:round;stroke-linejoin:round}
    .soft{fill:#f1eee5;stroke:#d9d4c8;stroke-width:1}
    .card{fill:#fffdf8;stroke:#d9d4c8;stroke-width:1.2}
    .head{font:700 23px Arial,sans-serif;fill:#303a34}
    .sub{font:15px Arial,sans-serif;fill:#59655d}
    .label{font:700 16px Arial,sans-serif;fill:#38433c}
    .body{font:15px Arial,sans-serif;fill:#465149}
    .small{font:14px Arial,sans-serif;fill:#59655d}
    .accentText{font:700 15px Arial,sans-serif;fill:#925638}
    .number{font:700 15px Arial,sans-serif;fill:#fffdf8}
  </style>
</defs>
<rect width="390" height="540" rx="18" fill="#fbf8f1"/>
<text class="head" x="18" y="34">Let the flower vary</text>
<text class="sub" x="18" y="59">Measure the flower you can see.</text>
<rect class="card" x="14" y="82" width="174" height="353" rx="12"/>
<text class="label" x="26" y="110">From memory</text>
<path class="ink" d="M101 216 Q97 260 100 356"/>
<circle class="light" cx="100" cy="166" r="21"/><circle class="light" cx="100" cy="129" r="17"/><circle class="light" cx="136" cy="166" r="17"/><circle class="light" cx="100" cy="203" r="17"/><circle class="light" cx="64" cy="166" r="17"/>
<circle class="light" cx="76" cy="140" r="16"/><circle class="light" cx="124" cy="140" r="16"/><circle class="light" cx="76" cy="192" r="16"/><circle class="light" cx="124" cy="192" r="16"/>
<path class="ink" d="M100 284 Q74 262 60 278 Q80 289 99 294 M101 320 Q125 300 143 315 Q125 328 101 330"/>
<text class="small" x="26" y="383">Same petals; straight stem.</text><text class="small" x="26" y="405">Looks like a symbol.</text>
<rect class="card" x="202" y="82" width="174" height="353" rx="12"/>
<text class="label" x="214" y="110">From this view</text>
<path class="guide" d="M289 215 L305 357"/>
<path class="ink" d="M288 215 C276 260 293 306 305 359"/>
<path class="ink" d="M288 215 C266 202 249 193 248 177 C247 160 264 155 278 165 C283 145 304 146 308 163 C326 155 339 170 330 187 C327 203 308 213 288 215Z"/>
<path class="light" d="M289 215 C286 197 277 179 281 164 M308 162 Q302 177 307 191 M330 187 Q313 183 301 186"/>
<path class="ink" d="M296 282 Q274 269 263 284 Q281 294 299 295"/>
<path class="ink" d="M300 318 Q323 297 339 309 Q325 322 302 328"/>
<path class="accent" marker-start="url(#arrow)" marker-end="url(#arrow)" d="M249 133 L332 133"/>
<text class="accentText" x="258" y="128">check width</text>
<text class="small" x="214" y="383">Tilt, lengths and gaps vary.</text><text class="small" x="214" y="405">Keep the observed wonkiness.</text>
<rect x="22" y="459" width="346" height="49" rx="10" fill="#eef0e9"/>
<text class="label" x="34" y="489">Measure this subject, not an ideal flower.</text>
</svg>
