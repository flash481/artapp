<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 540" role="img" aria-labelledby="title desc">
<title id="title">Three possible crops</title>
<desc id="desc">Three portrait frames contain the same mug and closed book arrangement at different scales and placements: generous margins, a closer crop, and a shifted crop. Pale areas around and between objects mark changing negative shapes.</desc>
<defs>
  <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#ad6847" stroke-width="1.5"/></marker>
  <style>
    .ink{fill:none;stroke:#37413b;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
    .light{fill:none;stroke:#9a9b8b;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
    .guide{fill:none;stroke:#829185;stroke-width:1.4;stroke-dasharray:5 5;stroke-linecap:round}
    .accent{fill:none;stroke:#ad6847;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
    .heavy{fill:none;stroke:#37413b;stroke-width:4.2;stroke-linecap:round;stroke-linejoin:round}
    .soft{fill:#f1eee5;stroke:#d9d4c8;stroke-width:1}
    .card{fill:#fffdf8;stroke:#d9d4c8;stroke-width:1.2}
    .head{font:700 23px Arial,sans-serif;fill:#303a34}
    .sub{font:15px Arial,sans-serif;fill:#59655d}
    .label{font:700 16px Arial,sans-serif;fill:#38433c}
    .body{font:15px Arial,sans-serif;fill:#465149}
    .small{font:14px Arial,sans-serif;fill:#59655d}
    .accentText{font:700 15px Arial,sans-serif;fill:#925638}
    .number{font:700 15px Arial,sans-serif;fill:#fffdf8}
  </style>
</defs>
<rect width="390" height="540" rx="18" fill="#fbf8f1"/>
<text class="head" x="18" y="34">Three possible crops</text>
<text class="sub" x="18" y="59">Margins and gaps shift with the crop.</text>
<rect class="card" x="15" y="82" width="360" height="111" rx="12"/>
<text class="label" x="27" y="108">Roomy</text><text class="small" x="94" y="108">more margin around both forms</text>
<rect x="26" y="119" width="338" height="61" rx="4" fill="#f4f1e9" stroke="#829185" stroke-width="1.5"/>
<path class="ink" d="M86 136 Q74 139 75 153 L78 166 L120 166 L123 151 Q122 139 110 136Z M84 138 Q99 131 114 138"/>
<path class="ink" d="M123 148 C144 142 144 163 122 160"/>
<path class="ink" d="M184 132 L276 132 L276 169 L184 169 Z M192 137 L269 137"/>
<path class="guide" d="M148 143 Q159 151 172 143"/>
<rect class="card" x="15" y="204" width="360" height="111" rx="12"/>
<text class="label" x="27" y="230">Closer</text><text class="small" x="94" y="230">the gaps and edges feel larger</text>
<rect x="26" y="241" width="338" height="61" rx="4" fill="#f4f1e9" stroke="#829185" stroke-width="1.5"/>
<path class="ink" d="M55 251 Q37 255 39 276 L43 293 L103 293 L106 270 Q105 255 88 251Z M51 254 Q73 244 94 254"/>
<path class="ink" d="M105 263 C136 249 141 293 103 281"/>
<path class="ink" d="M175 247 L313 247 L313 294 L175 294 Z M185 253 L304 253"/>
<path class="guide" d="M145 261 Q158 272 169 260"/>
<rect class="card" x="15" y="326" width="360" height="111" rx="12"/>
<text class="label" x="27" y="352">Shifted</text><text class="small" x="94" y="352">one side receives less room</text>
<rect x="26" y="363" width="338" height="61" rx="4" fill="#f4f1e9" stroke="#829185" stroke-width="1.5"/>
<path class="ink" d="M32 374 Q20 377 23 392 L26 415 L71 415 L74 388 Q74 376 58 374Z M29 377 Q50 369 65 377"/>
<path class="ink" d="M73 385 C102 371 108 414 71 403"/>
<path class="ink" d="M132 369 L268 369 L268 416 L132 416 Z M140 375 L260 375"/>
<path class="guide" d="M108 383 Q119 393 128 381"/>
<text class="small" x="26" y="472">Look at frame edges and gaps between forms.</text>
<text class="small" x="26" y="494">Each crop can change how the arrangement reads.</text>
</svg>
