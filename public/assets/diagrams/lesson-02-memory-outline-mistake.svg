<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1000" role="img" aria-labelledby="title desc"><title id="title">Memory vs. observation</title><desc id="desc">A smooth generic shoe icon with no clear heel or toe turns is contrasted with an observed side view that has a distinct heel-to-collar turn, a long flat sole, and a sloped toe.</desc><rect class="bg" width="720" height="1000"/><style>text{font-family:Arial,Helvetica,sans-serif;fill:#263238}.bg{fill:#faf8f2}.panel{fill:#fff;stroke:#d8d3c9;stroke-width:2}.title{font-size:42px;font-weight:700}.subtitle{font-size:25px;fill:#505c62}.heading{font-size:29px;font-weight:700}.body{font-size:25px}.small{font-size:22px}.tag{font-size:22px;font-weight:700;letter-spacing:1px;fill:#087064}.ink{fill:none;stroke:#30383c;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}.thin{fill:none;stroke:#58646a;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.ghost{fill:none;stroke:#929b9b;stroke-width:4;stroke-dasharray:9 9;stroke-linecap:round;stroke-linejoin:round}.accent{fill:none;stroke:#087064;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}.accentFill{fill:#d8efea;stroke:#087064;stroke-width:3}.warn{fill:none;stroke:#b7472c;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}.warnFill{fill:#f7e2da;stroke:#b7472c;stroke-width:3}.soft{fill:#eef0ed;stroke:#536168;stroke-width:3}.rule{stroke:#d8d3c9;stroke-width:2}.footer{font-size:21px;fill:#58646a}</style><text x="38" y="58" class="title">Memory vs. observation</text><text x="40" y="101" class="subtitle">Check turns before smoothing.</text><rect x="32" y="145" width="316" height="575" rx="18" class="panel"/><text x="54" y="190" class="tag" style="fill:#b7472c">MEMORY SYMBOL</text><path d="M65 380 C71 324 110 296 160 302 C204 309 245 343 293 362 C319 373 320 408 295 421 C257 438 111 430 77 416 C61 409 57 394 65 380 Z" class="warn"/><path d="M76 411 C134 418 229 417 297 410" class="warn"/><path d="M126 330 L158 347 M132 344 L164 361 M139 358 L170 375" class="thin"/><text x="54" y="485" class="body">One smooth capsule.</text><text x="54" y="524" class="body">No specific heel turn</text><text x="54" y="563" class="body">or toe slope.</text><text x="54" y="630" class="small">Generic curves by habit.</text>
<rect x="372" y="145" width="316" height="575" rx="18" class="panel"/><text x="394" y="190" class="tag">LOOK AT THE SHOE</text><path d="M406 389 C411 369 425 344 433 320 L445 286 Q450 275 463 283 L482 328 L502 362 Q534 390 584 397 L633 405 Q659 409 656 426 Q650 441 627 445 L426 445 Q403 441 402 428 Z" class="ink"/><path d="M406 426 Q520 439 650 429" class="accent"/><path d="M445 286 Q449 305 433 320" class="accent"/><path d="M584 397 L633 405 Q650 409 656 426" class="accent"/><circle cx="436" cy="316" r="9" class="accentFill"/><circle cx="567" cy="392" r="9" class="accentFill"/><circle cx="641" cy="410" r="9" class="accentFill"/><text x="394" y="493" class="tag">HEEL TURN</text><text x="394" y="531" class="tag">FLAT SOLE</text><text x="394" y="569" class="tag">TOE SLOPE</text><text x="394" y="628" class="body">Specific to this shoe</text><text x="394" y="667" class="body">and this viewpoint.</text>
<rect x="32" y="747" width="656" height="143" rx="18" class="panel"/><text x="58" y="792" class="heading">If it feels too tidy, look again</text><text x="58" y="840" class="body">Point to where the real edge changes direction.</text><text x="40" y="970" class="footer">Find the turn on your own shoe.</text></svg>