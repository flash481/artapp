<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1000" role="img" aria-labelledby="title desc"><title id="title">Build from the open spaces</title><desc id="desc">A potted plant study shows outer page limits, three lightly highlighted gaps around and between leaves, and arrows from the gaps toward the neighboring plant edges they help locate.</desc><rect class="bg" width="720" height="1000"/><style>text{font-family:Arial,Helvetica,sans-serif;fill:#263238}.bg{fill:#faf8f2}.panel{fill:#fff;stroke:#d8d3c9;stroke-width:2}.title{font-size:42px;font-weight:700}.subtitle{font-size:25px;fill:#505c62}.heading{font-size:29px;font-weight:700}.body{font-size:25px}.small{font-size:22px}.tag{font-size:22px;font-weight:700;letter-spacing:1px;fill:#087064}.ink{fill:none;stroke:#30383c;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}.thin{fill:none;stroke:#58646a;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.ghost{fill:none;stroke:#929b9b;stroke-width:4;stroke-dasharray:9 9;stroke-linecap:round;stroke-linejoin:round}.accent{fill:none;stroke:#087064;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}.accentFill{fill:#d8efea;stroke:#087064;stroke-width:3}.warn{fill:none;stroke:#b7472c;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}.warnFill{fill:#f7e2da;stroke:#b7472c;stroke-width:3}.soft{fill:#eef0ed;stroke:#536168;stroke-width:3}.leaf{fill:#e7ede6;stroke:#30383c;stroke-width:4;stroke-linejoin:round}.footer{font-size:21px;fill:#58646a}</style><text x="38" y="58" class="title">Build from the open spaces</text><text x="40" y="101" class="subtitle">Let gaps help place the leaves.</text><rect x="32" y="137" width="656" height="477" rx="18" class="panel"/><text x="58" y="180" class="heading">Start with limits and large gaps</text><rect x="79" y="218" width="306" height="354" rx="8" class="ghost"/><text x="85" y="252" class="tag">TOP / SIDE LIMITS</text><g transform="translate(101 270) scale(0.78)"><path d="M151 245 C148 190 145 98 149 25 M151 245 C136 207 83 156 22 121 M151 245 C126 218 76 206 26 198 M152 244 C171 207 218 166 278 148 M152 244 C185 218 234 205 272 198" class="thin"/><path d="M149 20 C122 82 126 179 149 242 C173 177 178 82 149 20 Z" class="leaf"/><path d="M145 229 C94 215 47 171 22 121 C77 128 123 175 151 236 Z" class="leaf"/><path d="M146 232 C101 218 55 219 26 198 C51 171 104 183 151 234 Z" class="leaf"/><path d="M157 232 C186 176 232 145 278 148 C261 196 213 224 153 240 Z" class="leaf"/><path d="M156 235 C204 181 248 173 272 198 C243 221 205 220 154 242 Z" class="leaf"/><path d="M119 150 C130 145 138 136 142 126 C143 148 146 166 153 185 C140 174 128 163 119 150 Z" class="accentFill"/><path d="M159 160 C169 146 181 142 193 146 C185 161 176 172 159 183 Z" class="accentFill"/><path d="M111 255 L194 255 L183 322 Q153 337 122 322 Z" class="ink"/><path d="M119 272 Q152 284 188 272" class="thin"/></g><path d="M411 322 L477 294" class="accent"/><text x="482" y="294" class="body">Gap edges place</text><text x="482" y="330" class="body">nearby leaves.</text><path d="M411 418 L477 448" class="accent"/><text x="482" y="451" class="body">Check an opening</text><text x="482" y="487" class="body">before adding detail.</text>
<rect x="32" y="632" width="656" height="264" rx="18" class="panel"/><text x="58" y="678" class="tag">A SIMPLE DRAWING ORDER</text><text x="58" y="723" class="body">1. Mark the plant's top, bottom, left, and right.</text><text x="58" y="771" class="body">2. Draw three large gaps; hatch them lightly.</text><text x="58" y="819" class="body">3. Use their edges to place leaves, stems, and pot.</text><text x="58" y="865" class="small">Adjust one edge if its gap does not match life.</text><text x="40" y="970" class="footer">This is a possible order, not a target plant.</text></svg>