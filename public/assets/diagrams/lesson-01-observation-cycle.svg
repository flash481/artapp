<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1000" role="img" aria-labelledby="title desc">
<title id="title">Look, draw, compare</title><desc id="desc">Three mug studies show the same observed mug, a first sketch with one visible proportion to check, and a second sketch that changes only that relation.</desc><rect class="bg" width="720" height="1000"/><style>
text{font-family:Arial,Helvetica,sans-serif;fill:#263238}.bg{fill:#faf8f2}.panel{fill:#fff;stroke:#d8d3c9;stroke-width:2}.title{font-size:42px;font-weight:700}.subtitle{font-size:25px;fill:#505c62}.heading{font-size:29px;font-weight:700}.body{font-size:25px}.small{font-size:22px}.tag{font-size:22px;font-weight:700;letter-spacing:1px;fill:#087064}.ink{fill:none;stroke:#30383c;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}.thin{fill:none;stroke:#58646a;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.ghost{fill:none;stroke:#929b9b;stroke-width:4;stroke-dasharray:9 9;stroke-linecap:round;stroke-linejoin:round}.accent{fill:none;stroke:#087064;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}.accentFill{fill:#d8efea;stroke:#087064;stroke-width:3}.warn{fill:none;stroke:#b7472c;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}.warnFill{fill:#f7e2da;stroke:#b7472c;stroke-width:3}.soft{fill:#eef0ed;stroke:#536168;stroke-width:3}.leaf{fill:#e7ede6;stroke:#30383c;stroke-width:4;stroke-linejoin:round}.rule{stroke:#d8d3c9;stroke-width:2}.footer{font-size:21px;fill:#58646a}</style>
<text x="38" y="58" class="title">Look, draw, compare</text><text x="40" y="101" class="subtitle">Change one relation, then compare.</text><rect x="32" y="135" width="656" height="220" rx="18" class="panel"/><text x="58" y="178" class="heading">1. Look at this mug</text><text x="58" y="213" class="body">Keep one viewpoint. Notice height and width.</text><g transform="translate(90 220) scale(0.62 0.65)" class="ink"><ellipse cx="76" cy="25" rx="48" ry="14"/><path d="M28 27 C29 69 28 119 38 146 C53 162 101 163 116 146 C124 116 123 66 124 27"/><path d="M122 52 C165 43 164 123 121 117"/><path d="M123 68 C145 67 145 101 122 101"/><path d="M39 143 C58 151 97 153 115 143"/></g><path d="M86 245 L86 336 M76 245 L96 245 M76 336 L96 336" class="accent"/><text x="210" y="281" class="small">height</text><path d="M111 338 L163 338 M111 329 L111 347 M163 329 L163 347" class="accent"/><text x="210" y="346" class="small">width</text>
<rect x="32" y="377" width="656" height="220" rx="18" class="panel"/><text x="58" y="420" class="heading">2. Keep the first try</text><text x="58" y="455" class="body">It records your first estimate.</text><g transform="translate(105 456) scale(1.00 0.50)" class="ink"><ellipse cx="76" cy="25" rx="48" ry="14"/><path d="M28 27 C29 69 28 119 38 146 C53 162 101 163 116 146 C124 116 123 66 124 27"/><path d="M122 52 C165 43 164 123 121 117"/><path d="M123 68 C145 67 145 101 122 101"/><path d="M39 143 C58 151 97 153 115 143"/></g><path d="M89 481 L89 565 M79 481 L99 481 M79 565 L99 565" class="warn"/><path d="M124 566 L202 566 M124 557 L124 575 M202 557 L202 575" class="warn"/><text x="360" y="508" class="tag">ONE CHECK</text><text x="360" y="545" class="body">Does its height match</text><text x="360" y="578" class="body">its width on the real mug?</text>
<rect x="32" y="619" width="656" height="252" rx="18" class="panel"/><text x="58" y="662" class="heading">3. Make one new estimate</text><text x="58" y="698" class="body">Look back, adjust that relation, check again.</text><g transform="translate(105 707) scale(0.55 0.90)" class="ink"><ellipse cx="76" cy="25" rx="48" ry="14"/><path d="M28 27 C29 69 28 119 38 146 C53 162 101 163 116 146 C124 116 123 66 124 27"/><path d="M122 52 C165 43 164 123 121 117"/><path d="M123 68 C145 67 145 101 122 101"/><path d="M39 143 C58 151 97 153 115 143"/></g><path d="M328 775 L395 775" class="accent"/><path d="M386 765 L399 775 L386 785" class="accent"/><text x="425" y="757" class="tag">LOOK AGAIN</text><text x="425" y="794" class="body">The second sketch is</text><text x="425" y="827" class="body">a test, not a finish.</text>
<text x="40" y="970" class="footer">Example only: check the mug in front of you.</text></svg>