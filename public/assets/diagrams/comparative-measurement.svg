<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360" role="img" aria-labelledby="title desc">
  <title id="title">Compare parts of a mug</title>
  <desc id="desc">A simple mug outline with a pencil used as a repeatable width unit.</desc>
  <rect width="680" height="360" rx="20" fill="#fbf8f0"/>
  <path d="M220 100h205v164H220z" fill="#f4f0e6" stroke="#38463f" stroke-width="5"/>
