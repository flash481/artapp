  <path d="M216 89h214" stroke="#bd7859" stroke-width="3"/>
  <path d="M216 80v18m214-18v18" stroke="#bd7859" stroke-width="3"/>
  <text x="323" y="74" fill="#8b513a" font-family="system-ui,sans-serif" font-size="18" text-anchor="middle">overall width</text>
  <path d="M163 101v163" stroke="#527b7c" stroke-width="6" stroke-linecap="round"/>
