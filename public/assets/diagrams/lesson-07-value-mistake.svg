<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 650" role="img" aria-labelledby="title desc">
  <title id="title">Avoid patchwork shading</title>
  <desc id="desc">Many isolated marks make the upper fruit hard to read. The lower example groups the fruit into light, middle, and dark, with a separate cast shadow shifted away from the upper-left lamp.</desc>
  <rect width="480" height="650" rx="20" fill="#fbf8f0"/>
  <text x="240" y="42" fill="#33413b" font-family="system-ui,sans-serif" font-size="25" font-weight="700" text-anchor="middle">Group first; detail later</text>
  <rect x="24" y="66" width="432" height="240" rx="15" fill="#f4f0e6"/>
  <text x="48" y="102" fill="#a04f39" font-family="system-ui,sans-serif" font-size="20" font-weight="700">TOO PATCHY</text>
  <path d="M140 139c-18-17-42-7-42 26s19 51 43 49c27 2 46-16 45-49s-27-43-46-26z" fill="#c19b68" stroke="#33413b" stroke-width="3"/>
  <path d="m108 155 16 12m-13 19 21-6m-19 24 20 8m9-57 15 12m-8 18 22-8m-22 25 16 9m13-55 10 14" fill="none" stroke="#58493d" stroke-width="5" stroke-linecap="round"/>
  <text x="236" y="151" fill="#33413b" font-family="system-ui,sans-serif" font-size="18" font-weight="700">Many patches</text>
  <text x="236" y="179" fill="#33413b" font-family="system-ui,sans-serif" font-size="17">break big groups.</text>
  <text x="236" y="219" fill="#53635b" font-family="system-ui,sans-serif" font-size="17">Squint: can you still</text>
  <text x="236" y="246" fill="#53635b" font-family="system-ui,sans-serif" font-size="17">read the fruit's turn?</text>
  <ellipse cx="195" cy="225" rx="63" ry="9" fill="#58493d"/>
  <rect x="24" y="322" width="432" height="248" rx="15" fill="#f4f0e6"/>
  <text x="48" y="358" fill="#237680" font-family="system-ui,sans-serif" font-size="20" font-weight="700">CLEAR GROUPS</text>
  <path d="M140 395c-18-17-42-7-42 26s19 51 43 49c27 2 46-16 45-49s-27-43-46-26z" fill="#c19b68" stroke="#33413b" stroke-width="3"/>
  <path d="M140 395c-14-11-31-6-38 8-5 12-2 28 5 38 6 8 14 13 34 16z" fill="#f4efdd"/>
  <path d="M140 395c14-11 31-6 38 8 5 12 2 28-5 38-6 8-14 13-34 16z" fill="#58493d"/>
  <ellipse cx="211" cy="478" rx="76" ry="9" fill="#58493d"/>
  <text x="290" y="414" fill="#33413b" font-family="system-ui,sans-serif" font-size="17" font-weight="700">Light / middle / dark</text>
  <text x="290" y="445" fill="#53635b" font-family="system-ui,sans-serif" font-size="17">Keep planes broad.</text>
  <text x="290" y="473" fill="#53635b" font-family="system-ui,sans-serif" font-size="17">Shadow lies right.</text>
  <text x="240" y="608" fill="#53635b" font-family="system-ui,sans-serif" font-size="18" text-anchor="middle">Follow the light you see.</text>
</svg>
