<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 830" role="img" aria-labelledby="title desc">
  <title id="title">Four checks while drawing a cup</title>
  <desc id="desc">The sequence compares overall proportions, lightly constructs a body around a center axis, places a separate handle at observed attachments, and checks the drawing to correct one mismatch.</desc>
  <rect width="480" height="830" rx="20" fill="#fbf8f0"/>
  <text x="240" y="42" fill="#33413b" font-family="system-ui,sans-serif" font-size="24" font-weight="700" text-anchor="middle">Observe · construct · correct</text>
  <rect x="22" y="66" width="436" height="168" rx="14" fill="#f4f0e6"/>
  <text x="46" y="102" fill="#33413b" font-family="system-ui,sans-serif" font-size="20" font-weight="700">1 · Compare proportions</text>
  <ellipse cx="143" cy="148" rx="42" ry="13" fill="#fbf8f0" stroke="#33413b" stroke-width="3"/>
  <path d="M101 148v59 M185 148v59 M101 207a42 12 0 0 0 84 0" fill="none" stroke="#33413b" stroke-width="3"/>
  <line x1="143" y1="128" x2="143" y2="218" stroke="#237680" stroke-width="2" stroke-dasharray="7 7"/>
  <line x1="86" y1="221" x2="200" y2="221" stroke="#bc6b4e" stroke-width="2"/>
  <text x="235" y="145" fill="#53635b" font-family="system-ui,sans-serif" font-size="18">Measure height</text>
  <text x="235" y="176" fill="#53635b" font-family="system-ui,sans-serif" font-size="18">against width.</text>
  <text x="235" y="207" fill="#53635b" font-family="system-ui,sans-serif" font-size="18">Hold viewpoint.</text>
  <rect x="22" y="246" width="436" height="172" rx="14" fill="#f4f0e6"/>
  <text x="46" y="282" fill="#33413b" font-family="system-ui,sans-serif" font-size="20" font-weight="700">2 · Build the body lightly</text>
  <ellipse cx="143" cy="330" rx="42" ry="13" fill="#fbf8f0" stroke="#33413b" stroke-width="3"/>
  <path d="M101 330 111 385 M185 330 175 385 M111 385a32 10 0 0 0 64 0" fill="none" stroke="#33413b" stroke-width="3"/>
  <line x1="143" y1="311" x2="143" y2="403" stroke="#237680" stroke-width="2" stroke-dasharray="7 7"/>
  <text x="235" y="324" fill="#53635b" font-family="system-ui,sans-serif" font-size="18">Check rim tilt.</text>
  <text x="235" y="355" fill="#53635b" font-family="system-ui,sans-serif" font-size="18">Follow the taper.</text>
  <text x="235" y="386" fill="#53635b" font-family="system-ui,sans-serif" font-size="18">Base guide stays pale.</text>
  <rect x="22" y="430" width="436" height="172" rx="14" fill="#f4f0e6"/>
  <text x="46" y="466" fill="#33413b" font-family="system-ui,sans-serif" font-size="20" font-weight="700">3 · Attach a separate loop</text>
  <ellipse cx="129" cy="510" rx="38" ry="12" fill="#fbf8f0" stroke="#33413b" stroke-width="3"/>
  <path d="M91 510 101 568 M167 510 157 568 M101 568a28 9 0 0 0 56 0" fill="none" stroke="#33413b" stroke-width="3"/>
  <path d="M167 520c48-8 52 39 0 40" fill="none" stroke="#8e9d91" stroke-width="12" stroke-linecap="round"/>
  <path d="M167 520c48-8 52 39 0 40" fill="none" stroke="#33413b" stroke-width="3" stroke-linecap="round"/>
  <circle cx="167" cy="520" r="5" fill="#bc6b4e"/><circle cx="167" cy="560" r="5" fill="#bc6b4e"/>
  <text x="235" y="515" fill="#53635b" font-family="system-ui,sans-serif" font-size="18">Mark two joins.</text>
  <text x="235" y="546" fill="#53635b" font-family="system-ui,sans-serif" font-size="18">Match their spacing.</text>
  <text x="235" y="577" fill="#53635b" font-family="system-ui,sans-serif" font-size="18">Check the opening.</text>
  <rect x="22" y="614" width="436" height="160" rx="14" fill="#f4f0e6"/>
  <text x="46" y="650" fill="#33413b" font-family="system-ui,sans-serif" font-size="20" font-weight="700">4 · Compare and revise</text>
  <path d="M70 694h54" stroke="#237680" stroke-width="3"/>
  <path d="M94 680v28" stroke="#bc6b4e" stroke-width="3"/>
  <text x="152" y="690" fill="#53635b" font-family="system-ui,sans-serif" font-size="18">Check axis, body, rim.</text>
  <text x="152" y="721" fill="#53635b" font-family="system-ui,sans-serif" font-size="18">Change one mismatch.</text>
  <text x="152" y="752" fill="#53635b" font-family="system-ui,sans-serif" font-size="18">Darken only seen edges.</text>
  <text x="240" y="810" fill="#53635b" font-family="system-ui,sans-serif" font-size="17" text-anchor="middle">Keep guides light until checked.</text>
</svg>
