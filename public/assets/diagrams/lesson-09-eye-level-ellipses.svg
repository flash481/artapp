<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 1020" role="img" aria-labelledby="title desc">
  <title id="title">Eye height changes the apparent bowl rim</title>
  <desc id="desc">Two stacked side views show one bowl at lower and higher eye levels. Below each, an equal-width normalized rim ellipse is flatter for the low view and more open for the higher view; real apparent widths can differ.</desc>
  <rect width="480" height="1020" rx="20" fill="#fbf8f0"/>
  <text x="240" y="42" fill="#38463f" font-family="system-ui,sans-serif" font-size="25" font-weight="600" text-anchor="middle">Bowl rim at two eye heights</text>

  <!-- Lower viewpoint panel. -->
  <rect x="18" y="65" width="444" height="415" rx="18" fill="#f4f0e6"/>
  <text x="240" y="106" fill="#38463f" font-family="system-ui,sans-serif" font-size="23" font-weight="600" text-anchor="middle">Lower eye</text>
  <path d="M56 162 H443" fill="none" stroke="#527b7c" stroke-width="3" stroke-dasharray="8 8"/>
  <text x="440" y="151" fill="#385f61" font-family="system-ui,sans-serif" font-size="20" text-anchor="end">eye level</text>
  <ellipse cx="70" cy="162" rx="15" ry="10" fill="#fbf8f0" stroke="#38463f" stroke-width="3"/>
  <circle cx="75" cy="162" r="4" fill="#38463f"/>
  <path d="M86 166 L250 196" fill="none" stroke="#bd7859" stroke-width="3" stroke-dasharray="7 7"/>
  <path d="M160 196 C168 218 185 242 205 254 Q250 270 295 254 C315 242 332 218 340 196" fill="#e9ddc5" stroke="#38463f" stroke-width="3"/>
  <path d="M160 196 H340" fill="none" stroke="#38463f" stroke-width="3"/>
  <text x="250" y="286" fill="#59645b" font-family="system-ui,sans-serif" font-size="20" text-anchor="middle">side view</text>
  <text x="250" y="316" fill="#59645b" font-family="system-ui,sans-serif" font-size="20" text-anchor="middle">rim shape • width normalized</text>
  <ellipse cx="250" cy="354" rx="90" ry="17" fill="#e9ddc5" stroke="#38463f" stroke-width="3"/>
  <text x="250" y="415" fill="#385f61" font-family="system-ui,sans-serif" font-size="22" font-weight="600" text-anchor="middle">flatter opening</text>

  <!-- Higher viewpoint panel. Bowl position and horizontal eye-to-bowl distance match the first panel. -->
  <rect x="18" y="490" width="444" height="415" rx="18" fill="#f4f0e6"/>
  <text x="240" y="531" fill="#38463f" font-family="system-ui,sans-serif" font-size="23" font-weight="600" text-anchor="middle">Higher eye</text>
  <path d="M56 585 H443" fill="none" stroke="#527b7c" stroke-width="3" stroke-dasharray="8 8"/>
  <text x="440" y="574" fill="#385f61" font-family="system-ui,sans-serif" font-size="20" text-anchor="end">eye level</text>
  <ellipse cx="70" cy="585" rx="15" ry="10" fill="#fbf8f0" stroke="#38463f" stroke-width="3"/>
  <circle cx="75" cy="585" r="4" fill="#38463f"/>
  <path d="M86 589 L250 670" fill="none" stroke="#bd7859" stroke-width="3" stroke-dasharray="7 7"/>
  <path d="M160 670 C168 692 185 716 205 728 Q250 744 295 728 C315 716 332 692 340 670" fill="#e9ddc5" stroke="#38463f" stroke-width="3"/>
  <path d="M160 670 H340" fill="none" stroke="#38463f" stroke-width="3"/>
  <text x="250" y="760" fill="#59645b" font-family="system-ui,sans-serif" font-size="20" text-anchor="middle">side view</text>
  <text x="250" y="790" fill="#59645b" font-family="system-ui,sans-serif" font-size="20" text-anchor="middle">rim shape • width normalized</text>
  <ellipse cx="250" cy="831" rx="90" ry="38" fill="#e9ddc5" stroke="#38463f" stroke-width="3"/>
  <text x="250" y="887" fill="#385f61" font-family="system-ui,sans-serif" font-size="22" font-weight="600" text-anchor="middle">more open ellipse</text>

  <text x="240" y="946" fill="#59645b" font-family="system-ui,sans-serif" font-size="20" text-anchor="middle">Rim sketches use equal widths to compare openness.</text>
  <text x="240" y="978" fill="#59645b" font-family="system-ui,sans-serif" font-size="20" text-anchor="middle">Measure the actual width and height in each view.</text>
</svg>
