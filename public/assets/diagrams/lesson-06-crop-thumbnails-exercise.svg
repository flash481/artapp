<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 540" role="img" aria-labelledby="title desc">
<title id="title">Compare three thumbnails</title>
<desc id="desc">Three rough thumbnail frames show the mug and book with different margins and a shifted crop; a larger selected frame below demonstrates carrying the chosen crop into a simple drawing.</desc>
<defs>
  <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#ad6847" stroke-width="1.5"/></marker>
  <style>
    .ink{fill:none;stroke:#37413b;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
    .light{fill:none;stroke:#9a9b8b;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
    .guide{fill:none;stroke:#829185;stroke-width:1.4;stroke-dasharray:5 5;stroke-linecap:round}
    .accent{fill:none;stroke:#ad6847;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
    .heavy{fill:none;stroke:#37413b;stroke-width:4.2;stroke-linecap:round;stroke-linejoin:round}
    .soft{fill:#f1eee5;stroke:#d9d4c8;stroke-width:1}
    .card{fill:#fffdf8;stroke:#d9d4c8;stroke-width:1.2}
    .head{font:700 23px Arial,sans-serif;fill:#303a34}
    .sub{font:15px Arial,sans-serif;fill:#59655d}
    .label{font:700 16px Arial,sans-serif;fill:#38433c}
    .body{font:15px Arial,sans-serif;fill:#465149}
    .small{font:14px Arial,sans-serif;fill:#59655d}
    .accentText{font:700 15px Arial,sans-serif;fill:#925638}
    .number{font:700 15px Arial,sans-serif;fill:#fffdf8}
  </style>
</defs>
<rect width="390" height="540" rx="18" fill="#fbf8f1"/>
<text class="head" x="18" y="34">Compare three thumbnails</text>
<text class="sub" x="18" y="59">Compare shapes, gaps, and margins.</text>
<rect class="card" x="12" y="83" width="116" height="206" rx="11"/>
<text class="label" x="24" y="109">1  roomy</text>
<rect x="23" y="122" width="94" height="127" fill="#f4f1e9" stroke="#829185"/>
<path class="light" d="M32 167 Q27 169 28 183 L31 205 L53 205 L56 183 Q55 170 46 167Z M54 179 C67 172 67 197 53 192"/>
<path class="light" d="M67 160 L103 160 L103 203 L67 203 Z M71 165 L99 165"/>
<text class="small" x="24" y="270">open margin</text>
<rect class="card" x="137" y="83" width="116" height="206" rx="11"/>
<text class="label" x="149" y="109">2  closer</text>
<rect x="148" y="122" width="94" height="127" fill="#f4f1e9" stroke="#829185"/>
<path class="light" d="M154 145 Q143 149 144 170 L148 211 L181 211 L183 168 Q182 148 169 145Z M181 162 C200 152 201 203 179 194"/>
<path class="light" d="M194 138 L235 138 L235 210 L194 210 Z M198 144 L230 144"/>
<text class="small" x="149" y="270">larger forms</text>
<rect class="card" x="262" y="83" width="116" height="206" rx="11"/>
<text class="label" x="274" y="109">3  shifted</text>
<rect x="273" y="122" width="94" height="127" fill="#f4f1e9" stroke="#829185"/>
<path class="light" d="M274 148 Q265 151 265 171 L268 209 L296 209 L298 166 Q296 149 286 148Z M297 163 C315 154 315 200 295 192"/>
<path class="light" d="M312 139 L362 139 L362 209 L312 209 Z M317 146 L356 146"/>
<text class="small" x="274" y="270">less room</text>
<path class="accent" d="M194 300 C194 311 194 317 194 326" marker-end="url(#arrow)"/>
<rect class="soft" x="15" y="328" width="360" height="139" rx="12"/>
<text class="label" x="29" y="356">Carry the clearest crop into a larger study</text>
<rect x="83" y="371" width="227" height="76" fill="#fffdf8" stroke="#829185" stroke-width="1.5"/>
<path class="ink" d="M101 390 Q92 392 93 406 L96 436 L126 436 L129 405 Q127 393 115 390Z M127 402 C143 394 145 429 124 423"/>
<path class="ink" d="M169 383 L277 383 L277 435 L169 435 Z M177 389 L270 389"/>
<path class="guide" d="M146 398 Q155 407 165 397"/>
<path class="accent" marker-end="url(#arrow)" d="M45 408 L83 408"/>
<text class="small" x="26" y="493">Check margins and gaps again before details.</text>
<text class="small" x="26" y="514">These are options; the observed view decides.</text>
</svg>
