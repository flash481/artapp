<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1000" role="img" aria-labelledby="title desc"><title id="title">Two shoe-edge warm-ups</title><desc id="desc">A shoe profile shows one short heel-to-collar edge and one sole-to-toe edge, each enlarged below with a marked turn to compare against the real shoe.</desc><rect class="bg" width="720" height="1000"/><style>text{font-family:Arial,Helvetica,sans-serif;fill:#263238}.bg{fill:#faf8f2}.panel{fill:#fff;stroke:#d8d3c9;stroke-width:2}.title{font-size:42px;font-weight:700}.subtitle{font-size:25px;fill:#505c62}.heading{font-size:29px;font-weight:700}.body{font-size:25px}.small{font-size:22px}.tag{font-size:22px;font-weight:700;letter-spacing:1px;fill:#087064}.ink{fill:none;stroke:#30383c;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}.thin{fill:none;stroke:#58646a;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.ghost{fill:none;stroke:#929b9b;stroke-width:4;stroke-dasharray:9 9;stroke-linecap:round;stroke-linejoin:round}.accent{fill:none;stroke:#087064;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}.accentFill{fill:#d8efea;stroke:#087064;stroke-width:3}.warn{fill:none;stroke:#b7472c;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}.warnFill{fill:#f7e2da;stroke:#b7472c;stroke-width:3}.soft{fill:#eef0ed;stroke:#536168;stroke-width:3}.rule{stroke:#d8d3c9;stroke-width:2}.footer{font-size:21px;fill:#58646a}</style><text x="38" y="58" class="title">Two shoe-edge warm-ups</text><text x="40" y="101" class="subtitle">Two edges, two clear turns.</text><rect x="32" y="137" width="656" height="292" rx="18" class="panel"/><text x="58" y="180" class="tag">1  HEEL TOWARD COLLAR</text><g transform="translate(84 232) scale(0.95 1.0)" class="ink"><path d="M18 115 C13 93 23 70 32 47 L44 19 C50 5 69 14 76 31 L92 72 C111 91 156 105 195 110 C217 112 229 126 216 141 C211 152 196 156 177 155 L22 155 C6 154 1 143 8 132 Z"/><path d="M17 130 C68 136 145 132 207 137"/><path d="M44 36 L70 47 M47 47 L73 57 M51 58 L77 67" class="thin"/></g><g transform="translate(84 232) scale(0.95 1.0)"><path d="M44 19 C37 34 26 62 18 92" class="accent"/><circle cx="18" cy="92" r="9" class="accentFill"/></g><text x="382" y="254" class="body">Draw one connected</text><text x="382" y="292" class="body">edge for 2 minutes.</text><text x="382" y="342" class="small">Pause at its strongest turn.</text>
<rect x="32" y="447" width="656" height="292" rx="18" class="panel"/><text x="58" y="490" class="tag">2  SOLE NEAR THE TOE</text><g transform="translate(84 541) scale(0.95 1.0)" class="ink"><path d="M18 115 C13 93 23 70 32 47 L44 19 C50 5 69 14 76 31 L92 72 C111 91 156 105 195 110 C217 112 229 126 216 141 C211 152 196 156 177 155 L22 155 C6 154 1 143 8 132 Z"/><path d="M17 130 C68 136 145 132 207 137"/><path d="M44 36 L70 47 M47 47 L73 57 M51 58 L77 67" class="thin"/></g><g transform="translate(84 541) scale(0.95 1.0)"><path d="M120 134 C150 135 179 134 207 137" class="accent"/><circle cx="207" cy="137" r="9" class="accentFill"/></g><text x="382" y="558" class="body">Follow the sole for</text><text x="382" y="596" class="body">2 minutes, looking back.</text><text x="382" y="638" class="small">Compare both turns</text><text x="382" y="671" class="small">for 2 minutes.</text>
<rect x="32" y="757" width="656" height="143" rx="18" class="panel"/><text x="58" y="803" class="heading">Use the last minute</text><text x="58" y="850" class="body">Mark the turn you will check in the full drawing.</text><text x="40" y="970" class="footer">Use the shoe at your chosen viewpoint.</text></svg>