<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1000" role="img" aria-labelledby="title desc">
<title id="title">Keep both mug drawings</title><desc id="desc">Two side-by-side mug sketches show a first pass kept on the page, one observed mismatch circled, and a second pass that tests one changed proportion.</desc><rect class="bg" width="720" height="1000"/><style>
text{font-family:Arial,Helvetica,sans-serif;fill:#263238}.bg{fill:#faf8f2}.panel{fill:#fff;stroke:#d8d3c9;stroke-width:2}.title{font-size:42px;font-weight:700}.subtitle{font-size:25px;fill:#505c62}.heading{font-size:29px;font-weight:700}.body{font-size:25px}.small{font-size:22px}.tag{font-size:22px;font-weight:700;letter-spacing:1px;fill:#087064}.ink{fill:none;stroke:#30383c;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}.thin{fill:none;stroke:#58646a;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.ghost{fill:none;stroke:#929b9b;stroke-width:4;stroke-dasharray:9 9;stroke-linecap:round;stroke-linejoin:round}.accent{fill:none;stroke:#087064;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}.accentFill{fill:#d8efea;stroke:#087064;stroke-width:3}.warn{fill:none;stroke:#b7472c;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}.warnFill{fill:#f7e2da;stroke:#b7472c;stroke-width:3}.soft{fill:#eef0ed;stroke:#536168;stroke-width:3}.leaf{fill:#e7ede6;stroke:#30383c;stroke-width:4;stroke-linejoin:round}.rule{stroke:#d8d3c9;stroke-width:2}.footer{font-size:21px;fill:#58646a}</style>
<text x="38" y="58" class="title">Keep both mug drawings</text><text x="40" y="101" class="subtitle">Keep the first; test one change.</text><rect x="32" y="135" width="316" height="374" rx="18" class="panel"/><text x="54" y="177" class="tag">FIRST PASS</text><text x="54" y="213" class="body">Keep it visible.</text><g transform="translate(104 249) scale(1.12 1.00)" class="ink"><ellipse cx="76" cy="25" rx="48" ry="14"/><path d="M28 27 C29 69 28 119 38 146 C53 162 101 163 116 146 C124 116 123 66 124 27"/><path d="M122 52 C165 43 164 123 121 117"/><path d="M123 68 C145 67 145 101 122 101"/><path d="M39 143 C58 151 97 153 115 143"/></g><path d="M91 282 L91 420 M80 282 L102 282 M80 420 L102 420" class="warn"/><text x="54" y="474" class="small">Example: body may look</text><text x="54" y="504" class="small">wider than the real mug.</text>
<rect x="372" y="135" width="316" height="374" rx="18" class="panel"/><text x="394" y="177" class="tag">SECOND PASS</text><text x="394" y="213" class="body">Test one change.</text><g transform="translate(444 249) scale(0.72 1.00)" class="ink"><ellipse cx="76" cy="25" rx="48" ry="14"/><path d="M28 27 C29 69 28 119 38 146 C53 162 101 163 116 146 C124 116 123 66 124 27"/><path d="M122 52 C165 43 164 123 121 117"/><path d="M123 68 C145 67 145 101 122 101"/><path d="M39 143 C58 151 97 153 115 143"/></g><path d="M421 420 L537 420 M421 411 L421 429 M537 411 L537 429" class="accent"/><text x="394" y="474" class="small">Recheck its width</text><text x="394" y="504" class="small">against this mug.</text>
<rect x="32" y="535" width="656" height="334" rx="18" class="panel"/><text x="58" y="580" class="heading">A useful correction stays specific</text><circle cx="82" cy="634" r="20" class="accentFill"/><text x="74" y="643" class="body">1</text><text x="119" y="643" class="body">Write one note beside the first drawing.</text><circle cx="82" cy="699" r="20" class="accentFill"/><text x="74" y="708" class="body">2</text><text x="119" y="708" class="body">Use the same mug and viewpoint again.</text><circle cx="82" cy="764" r="20" class="accentFill"/><text x="74" y="773" class="body">3</text><text x="119" y="773" class="body">Compare both drawings with the mug.</text><text x="58" y="830" class="small">Leave other differences for another practice pass.</text>
<text x="40" y="970" class="footer">Example only: check the mug in front of you.</text></svg>