<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 540" role="img" aria-labelledby="title desc">
<title id="title">Avoid a near-touch at the frame</title>
<desc id="desc">Two crop studies of a mug and book compare a book corner that almost touches the frame, leaving a narrow confusing sliver, with a roomier crop that gives the corner a clear margin.</desc>
<defs>
  <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#ad6847" stroke-width="1.5"/></marker>
  <style>
    .ink{fill:none;stroke:#37413b;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
    .light{fill:none;stroke:#9a9b8b;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
    .guide{fill:none;stroke:#829185;stroke-width:1.4;stroke-dasharray:5 5;stroke-linecap:round}
    .accent{fill:none;stroke:#ad6847;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
    .heavy{fill:none;stroke:#37413b;stroke-width:4.2;stroke-linecap:round;stroke-linejoin:round}
    .soft{fill:#f1eee5;stroke:#d9d4c8;stroke-width:1}
    .card{fill:#fffdf8;stroke:#d9d4c8;stroke-width:1.2}
    .head{font:700 23px Arial,sans-serif;fill:#303a34}
    .sub{font:15px Arial,sans-serif;fill:#59655d}
    .label{font:700 16px Arial,sans-serif;fill:#38433c}
    .body{font:15px Arial,sans-serif;fill:#465149}
    .small{font:14px Arial,sans-serif;fill:#59655d}
    .accentText{font:700 15px Arial,sans-serif;fill:#925638}
    .number{font:700 15px Arial,sans-serif;fill:#fffdf8}
  </style>
</defs>
<rect width="390" height="540" rx="18" fill="#fbf8f1"/>
<text class="head" x="18" y="34">Avoid a near-touch at the frame</text>
<text class="sub" x="18" y="59">Give the corner a clear margin.</text>
<rect class="card" x="15" y="83" width="360" height="164" rx="12"/>
<text class="label" x="29" y="111">Awkward near-touch</text>
<rect x="39" y="126" width="309" height="98" fill="#f4f1e9" stroke="#829185" stroke-width="1.8"/>
<path class="ink" d="M63 157 Q50 160 52 177 L56 208 L97 208 L100 178 Q99 160 83 157Z M60 160 Q79 153 94 161"/>
<path class="ink" d="M99 173 C119 163 121 199 97 194"/>
<path class="ink" d="M172 135 L344 135 L344 217 L172 217 Z M181 142 L337 142"/>
<circle cx="343" cy="135" r="8" fill="none" stroke="#ad6847" stroke-width="2"/>
<path class="accent" marker-end="url(#arrow)" d="M316 119 L339 130"/>
<text class="accentText" x="168" y="235">corner / frame near-touch</text>
<rect class="card" x="15" y="259" width="360" height="174" rx="12"/>
<text class="label" x="29" y="287">Give the corner a clear margin</text>
<rect x="39" y="302" width="309" height="103" fill="#f4f1e9" stroke="#829185" stroke-width="1.8"/>
<path class="ink" d="M65 329 Q52 332 54 349 L58 389 L100 389 L102 350 Q100 332 85 329Z M62 332 Q81 325 96 333"/>
<path class="ink" d="M101 346 C121 336 123 377 99 369"/>
<path class="ink" d="M167 317 L322 317 L322 391 L167 391 Z M176 324 L315 324"/>
<path class="guide" d="M323 318 L340 304 M323 318 L340 333"/>
<text class="small" x="29" y="423">Widen the frame or crop decisively.</text>
<rect x="22" y="457" width="346" height="51" rx="10" fill="#eef0e9"/>
<text class="label" x="34" y="481">No crop is automatically right;</text>
<text class="small" x="34" y="500">choose the one that reads clearly.</text>
</svg>
