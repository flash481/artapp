<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 540" role="img" aria-labelledby="title desc">
<title id="title">Three passes at one book</title>
<desc id="desc">Three studies of the same book show pale searching lines, a second drawing with three firmer selected edges, and a larger imperfect drawing that keeps quieter edges light.</desc>
<defs>
  <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#ad6847" stroke-width="1.5"/></marker>
  <style>
    .ink{fill:none;stroke:#37413b;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
    .light{fill:none;stroke:#9a9b8b;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
    .guide{fill:none;stroke:#829185;stroke-width:1.4;stroke-dasharray:5 5;stroke-linecap:round}
    .accent{fill:none;stroke:#ad6847;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
    .heavy{fill:none;stroke:#37413b;stroke-width:4.2;stroke-linecap:round;stroke-linejoin:round}
    .soft{fill:#f1eee5;stroke:#d9d4c8;stroke-width:1}
    .card{fill:#fffdf8;stroke:#d9d4c8;stroke-width:1.2}
    .head{font:700 23px Arial,sans-serif;fill:#303a34}
    .sub{font:15px Arial,sans-serif;fill:#59655d}
    .label{font:700 16px Arial,sans-serif;fill:#38433c}
    .body{font:15px Arial,sans-serif;fill:#465149}
    .small{font:14px Arial,sans-serif;fill:#59655d}
    .accentText{font:700 15px Arial,sans-serif;fill:#925638}
    .number{font:700 15px Arial,sans-serif;fill:#fffdf8}
  </style>
</defs>
<rect width="390" height="540" rx="18" fill="#fbf8f1"/>
<text class="head" x="18" y="34">Three passes at one book</text>
<text class="sub" x="18" y="59">Keep useful lines; release extra searches.</text>
<rect class="card" x="12" y="83" width="116" height="221" rx="11"/>
<text class="label" x="24" y="109">5 min</text><text class="small" x="24" y="130">search</text>
<path class="light" d="M36 171 L106 162 L111 239 L42 247 Z M32 177 L101 168 L107 244 L37 252 Z M39 168 L111 175 L105 250"/>
<path class="light" d="M46 187 L100 180 M42 238 L104 231"/>
<text class="small" x="23" y="277">Loose marks</text>
<rect class="card" x="137" y="83" width="116" height="221" rx="11"/>
<text class="label" x="149" y="109">7 min</text><text class="small" x="149" y="130">select</text>
<path class="light" d="M159 173 L229 164 L235 240 L164 248 Z"/>
<path class="heavy" d="M159 173 L229 164 M159 173 L164 248 M164 248 L235 240"/>
<path class="light" d="M229 164 L235 240 M170 186 L223 180"/>
<text class="small" x="148" y="277">3 selected</text>
<rect class="card" x="262" y="83" width="116" height="221" rx="11"/>
<text class="label" x="274" y="109">16 min</text><text class="small" x="274" y="130">larger</text>
<path class="light" d="M279 171 L350 165 L360 248 L286 258 Z M276 178 L354 172"/>
<path class="ink" d="M279 171 Q315 170 350 165 M279 171 L286 258 M286 258 L360 248"/>
<path class="light" d="M350 165 L360 248 M294 187 L345 181 M291 245 L350 237"/>
<text class="small" x="272" y="277">Quieter edges</text>
<rect class="soft" x="15" y="319" width="360" height="114" rx="12"/>
<text class="label" x="29" y="348">Same familiar object, steadier decisions</text>
<path class="light" d="M111 369 L265 357 L276 411 L120 421 Z M115 377 L268 365"/>
<path class="ink" d="M111 369 L265 357 M111 369 L120 421 M120 421 L276 411"/>
<path class="light" d="M265 357 L276 411 M129 380 L255 371"/>
<path class="accent" marker-end="url(#arrow)" d="M303 379 L275 379"/>
<text class="small" x="29" y="458">Compare the three; soften a confusing stray mark.</text>
<text class="small" x="29" y="480">Stop before shading; keep the object in view.</text>
<text class="small" x="29" y="510">Use a key instead if that is your chosen subject.</text>
</svg>
