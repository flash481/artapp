<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1000" role="img" aria-labelledby="title desc"><title id="title">Restate one shoe contour</title><desc id="desc">Two shoe drawings show the first outline kept on the page, one toe turn circled, and a second outline with a visibly different toe angle while other parts remain a rough first pass.</desc><rect class="bg" width="720" height="1000"/><style>text{font-family:Arial,Helvetica,sans-serif;fill:#263238}.bg{fill:#faf8f2}.panel{fill:#fff;stroke:#d8d3c9;stroke-width:2}.title{font-size:42px;font-weight:700}.subtitle{font-size:25px;fill:#505c62}.heading{font-size:29px;font-weight:700}.body{font-size:25px}.small{font-size:22px}.tag{font-size:22px;font-weight:700;letter-spacing:1px;fill:#087064}.ink{fill:none;stroke:#30383c;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}.thin{fill:none;stroke:#58646a;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.ghost{fill:none;stroke:#929b9b;stroke-width:4;stroke-dasharray:9 9;stroke-linecap:round;stroke-linejoin:round}.accent{fill:none;stroke:#087064;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}.accentFill{fill:#d8efea;stroke:#087064;stroke-width:3}.warn{fill:none;stroke:#b7472c;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}.warnFill{fill:#f7e2da;stroke:#b7472c;stroke-width:3}.soft{fill:#eef0ed;stroke:#536168;stroke-width:3}.rule{stroke:#d8d3c9;stroke-width:2}.footer{font-size:21px;fill:#58646a}</style><text x="38" y="58" class="title">Restate one shoe contour</text><text x="40" y="101" class="subtitle">Keep the first outline.</text><rect x="32" y="137" width="316" height="395" rx="18" class="panel"/><text x="54" y="180" class="tag">FIRST PASS</text><text x="54" y="217" class="body">Keep the outline.</text><g transform="translate(78 277) scale(1.04 1.16)" class="ink"><path d="M18 115 C13 93 23 70 32 47 L44 19 C50 5 69 14 76 31 L92 72 C111 91 156 105 195 110 C217 112 229 126 216 141 C211 152 196 156 177 155 L22 155 C6 154 1 143 8 132 Z"/><path d="M17 130 C68 136 145 132 207 137"/><path d="M44 36 L70 47 M47 47 L73 57 M51 58 L77 67" class="thin"/></g><circle cx="293" cy="420" r="32" class="warn"/><path d="M282 449 L264 479" class="warn"/><text x="54" y="493" class="small">Circle one toe turn to check.</text>
<rect x="372" y="137" width="316" height="395" rx="18" class="panel"/><text x="394" y="180" class="tag">SECOND PASS</text><text x="394" y="217" class="body">Test that one turn.</text><g transform="translate(416 277) scale(1.04 1.16)" class="ink"><path d="M18 115 C13 93 23 70 32 47 L44 19 C50 5 69 14 76 31 L92 72 C111 91 156 105 195 110 C215 112 225 119 220 132 C216 148 198 155 177 155 L22 155 C6 154 1 143 8 132 Z"/><path d="M17 130 C68 136 145 132 207 137"/><path d="M44 36 L70 47 M47 47 L73 57 M51 58 L77 67" class="thin"/></g><circle cx="637" cy="420" r="32" class="accent"/><path d="M626 449 L606 479" class="accent"/><text x="394" y="493" class="small">Compare it with the shoe.</text>
<rect x="32" y="558" width="656" height="330" rx="18" class="panel"/><text x="58" y="605" class="heading">A clear order keeps the drawing simple</text><circle cx="83" cy="662" r="20" class="accentFill"/><text x="75" y="671" class="body">1</text><text x="120" y="671" class="body">Draw the outer contour in connected sections.</text><circle cx="83" cy="725" r="20" class="accentFill"/><text x="75" y="734" class="body">2</text><text x="120" y="734" class="body">Compare one turn; make a separate restatement.</text><circle cx="83" cy="788" r="20" class="accentFill"/><text x="75" y="797" class="body">3</text><text x="120" y="797" class="body">Add only a few identifying interior edges.</text><text x="58" y="850" class="small">Use your shoe to decide the actual contour.</text><text x="40" y="970" class="footer">The toe shape here is only an example.</text></svg>