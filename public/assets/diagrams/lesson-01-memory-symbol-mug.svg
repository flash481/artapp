<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1000" role="img" aria-labelledby="title desc">
<title id="title">Draw the mug you see</title><desc id="desc">A familiar mug symbol with even sides is contrasted with an observed mug whose rim, body, and handle opening have distinct visible relationships.</desc><rect class="bg" width="720" height="1000"/><style>
text{font-family:Arial,Helvetica,sans-serif;fill:#263238}.bg{fill:#faf8f2}.panel{fill:#fff;stroke:#d8d3c9;stroke-width:2}.title{font-size:42px;font-weight:700}.subtitle{font-size:25px;fill:#505c62}.heading{font-size:29px;font-weight:700}.body{font-size:25px}.small{font-size:22px}.tag{font-size:22px;font-weight:700;letter-spacing:1px;fill:#087064}.ink{fill:none;stroke:#30383c;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}.thin{fill:none;stroke:#58646a;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.ghost{fill:none;stroke:#929b9b;stroke-width:4;stroke-dasharray:9 9;stroke-linecap:round;stroke-linejoin:round}.accent{fill:none;stroke:#087064;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}.accentFill{fill:#d8efea;stroke:#087064;stroke-width:3}.warn{fill:none;stroke:#b7472c;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}.warnFill{fill:#f7e2da;stroke:#b7472c;stroke-width:3}.soft{fill:#eef0ed;stroke:#536168;stroke-width:3}.leaf{fill:#e7ede6;stroke:#30383c;stroke-width:4;stroke-linejoin:round}.rule{stroke:#d8d3c9;stroke-width:2}.footer{font-size:21px;fill:#58646a}</style>
<text x="38" y="58" class="title">Draw the mug you see</text><text x="40" y="101" class="subtitle">Check the real mug.</text><rect x="32" y="145" width="316" height="568" rx="18" class="panel"/><text x="54" y="190" class="tag" style="fill:#b7472c">MEMORY SYMBOL</text><g transform="translate(90 280) scale(.96 .96)" class="warn"><ellipse cx="76" cy="25" rx="48" ry="14"/><path d="M28 27 L31 145 Q76 163 116 145 L124 27"/><path d="M122 52 C165 43 164 123 121 117 M123 68 C145 67 145 101 122 101"/></g><text x="54" y="526" class="body">Parallel sides by habit.</text><text x="54" y="565" class="body">A flat rim and round</text><text x="54" y="604" class="body">handle from memory.</text><path d="M130 647 L246 647" class="warn"/><path d="M143 635 L130 647 L143 659 M233 635 L246 647 L233 659" class="warn"/>
<rect x="372" y="145" width="316" height="568" rx="18" class="panel"/><text x="394" y="190" class="tag">OBSERVE THIS MUG</text><g transform="translate(433 280) scale(.96 .96)" class="ink"><path d="M31 22 Q70 8 119 29 C111 64 119 116 103 146 Q66 159 34 143 C39 105 38 57 31 22 Z"/><path d="M117 52 C158 42 160 115 114 111 M120 68 C143 66 146 99 119 97"/><path d="M31 22 Q71 39 119 29" class="accent"/><path d="M41 140 Q75 147 104 140" class="thin"/></g><circle cx="545" cy="315" r="24" class="accent"/><text x="394" y="526" class="body">Check today's rim tilt,</text><text x="394" y="565" class="body">body taper, and handle</text><text x="394" y="604" class="body">opening against life.</text>
<rect x="32" y="742" width="656" height="142" rx="18" class="panel"/><text x="58" y="790" class="heading">Ask the object one question</text><text x="58" y="836" class="body">What visible relation differs from your first guess?</text><text x="40" y="970" class="footer">Example only: check the mug in front of you.</text></svg>