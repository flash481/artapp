<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1000" role="img" aria-labelledby="title desc"><title id="title">Find two plant gaps</title><desc id="desc">A plant sketch has two open spaces marked between leaves; separate enlarged gap studies beside it show that each opening has a distinct width and angle to compare with the plant.</desc><rect class="bg" width="720" height="1000"/><style>text{font-family:Arial,Helvetica,sans-serif;fill:#263238}.bg{fill:#faf8f2}.panel{fill:#fff;stroke:#d8d3c9;stroke-width:2}.title{font-size:42px;font-weight:700}.subtitle{font-size:25px;fill:#505c62}.heading{font-size:29px;font-weight:700}.body{font-size:25px}.small{font-size:22px}.tag{font-size:22px;font-weight:700;letter-spacing:1px;fill:#087064}.ink{fill:none;stroke:#30383c;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}.thin{fill:none;stroke:#58646a;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.ghost{fill:none;stroke:#929b9b;stroke-width:4;stroke-dasharray:9 9;stroke-linecap:round;stroke-linejoin:round}.accent{fill:none;stroke:#087064;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}.accentFill{fill:#d8efea;stroke:#087064;stroke-width:3}.warn{fill:none;stroke:#b7472c;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}.warnFill{fill:#f7e2da;stroke:#b7472c;stroke-width:3}.soft{fill:#eef0ed;stroke:#536168;stroke-width:3}.leaf{fill:#e7ede6;stroke:#30383c;stroke-width:4;stroke-linejoin:round}.footer{font-size:21px;fill:#58646a}</style><text x="38" y="58" class="title">Find two plant gaps</text><text x="40" y="101" class="subtitle">Compare each space with life.</text><rect x="32" y="137" width="656" height="442" rx="18" class="panel"/><text x="58" y="180" class="heading">Find two clear spaces first</text><g transform="translate(62 224) scale(0.72)"><path d="M151 245 C148 190 145 98 149 25 M151 245 C136 207 83 156 22 121 M151 245 C126 218 76 206 26 198 M152 244 C171 207 218 166 278 148 M152 244 C185 218 234 205 272 198" class="thin"/><path d="M149 20 C122 82 126 179 149 242 C173 177 178 82 149 20 Z" class="leaf"/><path d="M145 229 C94 215 47 171 22 121 C77 128 123 175 151 236 Z" class="leaf"/><path d="M146 232 C101 218 55 219 26 198 C51 171 104 183 151 234 Z" class="leaf"/><path d="M157 232 C186 176 232 145 278 148 C261 196 213 224 153 240 Z" class="leaf"/><path d="M156 235 C204 181 248 173 272 198 C243 221 205 220 154 242 Z" class="leaf"/><path d="M119 150 C130 145 138 136 142 126 C143 148 146 166 153 185 C140 174 128 163 119 150 Z" class="accentFill"/><path d="M159 160 C169 146 181 142 193 146 C185 161 176 172 159 183 Z" class="accentFill"/><path d="M111 255 L194 255 L183 322 Q153 337 122 322 Z" class="ink"/><path d="M119 272 Q152 284 188 272" class="thin"/></g><path d="M249 353 L326 278" class="accent"/><text x="287" y="250" class="tag">A</text><path d="M249 388 L459 394" class="accent"/><text x="469" y="402" class="tag">B</text><path d="M354 230 C379 250 388 273 378 303 C356 286 345 264 354 230 Z" class="accentFill"/><path d="M481 376 C512 354 544 358 566 383 C541 399 510 399 481 376 Z" class="accentFill"/><text x="350" y="344" class="small">Gap A</text><text x="502" y="438" class="small">Gap B</text><text x="358" y="484" class="small">Different openings,</text><text x="358" y="520" class="small">not repeated symbols.</text>
<rect x="32" y="597" width="656" height="299" rx="18" class="panel"/><text x="58" y="645" class="tag">7 MINUTES</text><text x="58" y="694" class="body">2 min: locate two gaps; trace their edges in the air.</text><text x="58" y="747" class="body">3 min: sketch each gap as a small shape.</text><text x="58" y="800" class="body">2 min: compare width and angle with the plant.</text><text x="58" y="854" class="small">Leave the leaves for the main drawing.</text><text x="40" y="970" class="footer">Keep the plant and viewpoint still.</text></svg>