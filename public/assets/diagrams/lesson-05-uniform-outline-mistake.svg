<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 540" role="img" aria-labelledby="title desc">
<title id="title">Vary line emphasis</title>
<desc id="desc">Two small book drawings compare an equally dark outline on every edge with a more useful mix of light search marks and a few checked firm edges.</desc>
<defs>
  <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#ad6847" stroke-width="1.5"/></marker>
  <style>
    .ink{fill:none;stroke:#37413b;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
    .light{fill:none;stroke:#9a9b8b;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
    .guide{fill:none;stroke:#829185;stroke-width:1.4;stroke-dasharray:5 5;stroke-linecap:round}
    .accent{fill:none;stroke:#ad6847;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
    .heavy{fill:none;stroke:#37413b;stroke-width:4.2;stroke-linecap:round;stroke-linejoin:round}
    .soft{fill:#f1eee5;stroke:#d9d4c8;stroke-width:1}
    .card{fill:#fffdf8;stroke:#d9d4c8;stroke-width:1.2}
    .head{font:700 23px Arial,sans-serif;fill:#303a34}
    .sub{font:15px Arial,sans-serif;fill:#59655d}
    .label{font:700 16px Arial,sans-serif;fill:#38433c}
    .body{font:15px Arial,sans-serif;fill:#465149}
    .small{font:14px Arial,sans-serif;fill:#59655d}
    .accentText{font:700 15px Arial,sans-serif;fill:#925638}
    .number{font:700 15px Arial,sans-serif;fill:#fffdf8}
  </style>
</defs>
<rect width="390" height="540" rx="18" fill="#fbf8f1"/>
<text class="head" x="18" y="34">Vary line emphasis</text>
<text class="sub" x="18" y="59">Not every edge needs equal emphasis.</text>
<rect class="card" x="15" y="83" width="360" height="158" rx="12"/>
<text class="label" x="29" y="111">Every edge equally dark</text>
<path class="heavy" d="M104 126 L274 114 L286 199 L116 210 Z M104 126 L116 210 M274 114 L286 199"/>
<path class="heavy" d="M123 137 L268 126 M118 200 L279 190"/>
<text class="small" x="29" y="231">The border competes with the shape.</text>
<rect class="card" x="15" y="255" width="360" height="174" rx="12"/>
<text class="label" x="29" y="283">Choose a few checked edges</text>
<path class="light" d="M104 312 L274 300 L286 385 L116 396 Z M109 318 L279 306"/>
<path class="heavy" d="M104 312 L274 300 M104 312 L116 396 M116 396 L286 385"/>
<path class="light" d="M274 300 L286 385 M123 325 L268 314 M121 386 L278 375"/>
<path class="accent" marker-end="url(#arrow)" d="M320 345 L282 345"/>
<text class="small" x="29" y="418">Most edges can stay light.</text>
<rect x="22" y="453" width="346" height="55" rx="10" fill="#eef0e9"/>
<text class="label" x="34" y="477">Strengthen a line for a reason:</text>
<text class="small" x="34" y="497">a corner, overlap or turn you have checked.</text>
</svg>
