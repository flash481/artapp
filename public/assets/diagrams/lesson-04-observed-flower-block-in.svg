<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 540" role="img" aria-labelledby="title desc">
<title id="title">Block in, compare, refine</title>
<desc id="desc">A three-stage flower study progresses from a tilted axis and endpoints to a loose asymmetrical bloom and leaves, then checks one length and the negative gap before a few details.</desc>
<defs>
  <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#ad6847" stroke-width="1.5"/></marker>
  <style>
    .ink{fill:none;stroke:#37413b;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
    .light{fill:none;stroke:#9a9b8b;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
    .guide{fill:none;stroke:#829185;stroke-width:1.4;stroke-dasharray:5 5;stroke-linecap:round}
    .accent{fill:none;stroke:#ad6847;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
    .heavy{fill:none;stroke:#37413b;stroke-width:4.2;stroke-linecap:round;stroke-linejoin:round}
    .soft{fill:#f1eee5;stroke:#d9d4c8;stroke-width:1}
    .card{fill:#fffdf8;stroke:#d9d4c8;stroke-width:1.2}
    .head{font:700 23px Arial,sans-serif;fill:#303a34}
    .sub{font:15px Arial,sans-serif;fill:#59655d}
    .label{font:700 16px Arial,sans-serif;fill:#38433c}
    .body{font:15px Arial,sans-serif;fill:#465149}
    .small{font:14px Arial,sans-serif;fill:#59655d}
    .accentText{font:700 15px Arial,sans-serif;fill:#925638}
    .number{font:700 15px Arial,sans-serif;fill:#fffdf8}
  </style>
</defs>
<rect width="390" height="540" rx="18" fill="#fbf8f1"/>
<text class="head" x="18" y="34">Block in, compare, refine</text>
<text class="sub" x="18" y="59">Large shapes first; a few details last.</text>
<rect class="card" x="15" y="82" width="360" height="104" rx="12"/>
<text class="label" x="28" y="108">1  Place the overall direction</text>
<path class="guide" d="M310 120 L325 172"/><path class="accent" d="M303 118 L317 118 M318 174 L333 174"/>
<text class="small" x="28" y="142">Mark top and bottom; draw the stem axis.</text>
<rect class="card" x="15" y="197" width="360" height="126" rx="12"/>
<text class="label" x="28" y="223">2  Block in the big shapes</text>
<path class="light" d="M215 268 C199 256 202 239 217 238 C224 222 243 229 242 244 C258 252 249 267 235 274 C231 283 215 279 215 268Z"/>
<path class="light" d="M228 276 Q230 294 235 308 M230 291 Q211 279 201 290 Q214 297 232 299 M232 300 Q250 287 263 298 Q250 305 235 308"/>
<text class="small" x="28" y="253">Bloom tilt</text><path class="accent" marker-end="url(#arrow)" d="M107 249 L197 250"/>
<text class="small" x="28" y="279">Leaf joins</text><path class="accent" marker-end="url(#arrow)" d="M101 280 L207 292"/>
<rect class="card" x="15" y="334" width="360" height="133" rx="12"/>
<text class="label" x="28" y="360">3  Check the gaps, then refine</text>
<path class="ink" d="M215 407 C199 394 202 378 218 376 C225 360 243 367 243 383 C258 391 249 407 235 412 C231 421 215 417 215 407Z"/>
<path class="ink" d="M228 415 Q230 434 236 454 M230 431 Q211 419 201 430 Q214 437 233 440 M233 441 Q251 427 263 438 Q250 446 236 454"/>
<path class="light" d="M202 377 Q191 388 195 400 M240 377 Q249 384 251 392"/>
<path class="accent" marker-end="url(#arrow)" d="M170 448 Q181 430 199 424"/>
<text class="small" x="28" y="390">Look at a gap shape:</text><text class="small" x="28" y="410">is its width or angle different?</text>
<text class="small" x="25" y="495">Correct what you see; preserve this flower's</text>
<text class="small" x="25" y="516">proportions before adding a few details.</text>
</svg>
