<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 540" role="img" aria-labelledby="title desc">
<title id="title">Seven-minute flower check</title>
<desc id="desc">Three stacked warm-up stages show a slightly crooked axis, loose bloom and leaf masses, then one measured bloom width with a stem-length and alignment check.</desc>
<defs>
  <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#ad6847" stroke-width="1.5"/></marker>
  <style>
    .ink{fill:none;stroke:#37413b;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
    .light{fill:none;stroke:#9a9b8b;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
    .guide{fill:none;stroke:#829185;stroke-width:1.4;stroke-dasharray:5 5;stroke-linecap:round}
    .accent{fill:none;stroke:#ad6847;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
    .heavy{fill:none;stroke:#37413b;stroke-width:4.2;stroke-linecap:round;stroke-linejoin:round}
    .soft{fill:#f1eee5;stroke:#d9d4c8;stroke-width:1}
    .card{fill:#fffdf8;stroke:#d9d4c8;stroke-width:1.2}
    .head{font:700 23px Arial,sans-serif;fill:#303a34}
    .sub{font:15px Arial,sans-serif;fill:#59655d}
    .label{font:700 16px Arial,sans-serif;fill:#38433c}
    .body{font:15px Arial,sans-serif;fill:#465149}
    .small{font:14px Arial,sans-serif;fill:#59655d}
    .accentText{font:700 15px Arial,sans-serif;fill:#925638}
    .number{font:700 15px Arial,sans-serif;fill:#fffdf8}
  </style>
</defs>
<rect width="390" height="540" rx="18" fill="#fbf8f1"/>
<text class="head" x="18" y="34">Seven-minute flower check</text>
<text class="sub" x="18" y="59">Direction first; compare near the end.</text>
<rect class="card" x="15" y="82" width="360" height="110" rx="12"/>
<circle cx="40" cy="109" r="15" fill="#829185"/><text class="number" x="35" y="114">1</text>
<text class="label" x="65" y="111">Axis and endpoints</text><text class="small" x="65" y="133">Hold the view; mark top and bottom.</text>
<path class="guide" d="M293 105 L305 174"/><path class="light" d="M298 110 Q291 139 305 173"/>
<path class="accent" d="M286 108 L301 108 M300 175 L315 175"/>
<rect class="card" x="15" y="204" width="360" height="121" rx="12"/>
<circle cx="40" cy="232" r="15" fill="#829185"/><text class="number" x="35" y="237">2</text>
<text class="label" x="65" y="233">Largest masses</text><text class="small" x="65" y="255">Place bloom and a few big leaves.</text>
<path class="light" d="M300 241 C286 230 290 217 302 220 C312 207 326 219 321 231 C333 238 323 250 310 252 C306 259 296 254 300 241Z"/>
<path class="light" d="M307 250 Q305 278 311 308"/>
<path class="light" d="M309 278 Q292 265 284 278 Q297 286 310 288 M310 293 Q326 279 336 290 Q324 299 311 302"/>
<rect class="card" x="15" y="337" width="360" height="126" rx="12"/>
<circle cx="40" cy="365" r="15" fill="#829185"/><text class="number" x="35" y="370">3</text>
<text class="label" x="65" y="366">One relationship</text><text class="small" x="65" y="388">Check a length or tilt.</text>
<path class="ink" d="M300 397 C287 387 290 372 303 372 C314 360 327 371 323 386 C335 394 325 407 312 409 C307 417 296 409 300 397Z"/>
<path class="ink" d="M308 408 Q306 430 313 450 M311 426 Q294 414 286 426 Q299 432 312 435"/>
<path class="accent" marker-start="url(#arrow)" marker-end="url(#arrow)" d="M287 357 L329 357"/>
<text class="accentText" x="289" y="349">1 unit</text>
<text class="small" x="24" y="495">Keep marks light enough to revise.</text>
<text class="small" x="24" y="516">A seven-minute study can stay unfinished.</text>
</svg>
