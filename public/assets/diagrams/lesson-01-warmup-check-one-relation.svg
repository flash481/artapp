<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1000" role="img" aria-labelledby="title desc">
<title id="title">Seven-minute mug warm-up</title><desc id="desc">A five-step timeline shows looking for 30 seconds, sketching for two minutes, comparing height and width, making a second two-minute sketch, and circling what changed.</desc><rect class="bg" width="720" height="1000"/><style>
text{font-family:Arial,Helvetica,sans-serif;fill:#263238}.bg{fill:#faf8f2}.panel{fill:#fff;stroke:#d8d3c9;stroke-width:2}.title{font-size:42px;font-weight:700}.subtitle{font-size:25px;fill:#505c62}.heading{font-size:29px;font-weight:700}.body{font-size:25px}.small{font-size:22px}.tag{font-size:22px;font-weight:700;letter-spacing:1px;fill:#087064}.ink{fill:none;stroke:#30383c;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}.thin{fill:none;stroke:#58646a;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.ghost{fill:none;stroke:#929b9b;stroke-width:4;stroke-dasharray:9 9;stroke-linecap:round;stroke-linejoin:round}.accent{fill:none;stroke:#087064;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}.accentFill{fill:#d8efea;stroke:#087064;stroke-width:3}.warn{fill:none;stroke:#b7472c;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}.warnFill{fill:#f7e2da;stroke:#b7472c;stroke-width:3}.soft{fill:#eef0ed;stroke:#536168;stroke-width:3}.leaf{fill:#e7ede6;stroke:#30383c;stroke-width:4;stroke-linejoin:round}.rule{stroke:#d8d3c9;stroke-width:2}.footer{font-size:21px;fill:#58646a}</style>
<text x="38" y="58" class="title">Seven-minute mug warm-up</text><text x="40" y="101" class="subtitle">Look, draw, compare, retry.</text><rect x="32" y="135" width="656" height="142" rx="18" class="panel"/><text x="58" y="178" class="tag">0:00-0:30  LOOK</text><text x="58" y="220" class="body">Look at the mug before drawing.</text><g transform="translate(535 158) scale(0.35 0.36)" class="ink"><ellipse cx="76" cy="25" rx="48" ry="14"/><path d="M28 27 C29 69 28 119 38 146 C53 162 101 163 116 146 C124 116 123 66 124 27"/><path d="M122 52 C165 43 164 123 121 117"/><path d="M123 68 C145 67 145 101 122 101"/><path d="M39 143 C58 151 97 153 115 143"/></g>
<rect x="32" y="293" width="656" height="142" rx="18" class="panel"/><text x="58" y="337" class="tag">0:30-2:30  FIRST SKETCH</text><text x="58" y="379" class="body">Draw a small mug. Keep this attempt.</text><g transform="translate(545 319) scale(0.34 0.31)" class="ink"><ellipse cx="76" cy="25" rx="48" ry="14"/><path d="M28 27 C29 69 28 119 38 146 C53 162 101 163 116 146 C124 116 123 66 124 27"/><path d="M122 52 C165 43 164 123 121 117"/><path d="M123 68 C145 67 145 101 122 101"/><path d="M39 143 C58 151 97 153 115 143"/></g>
<rect x="32" y="451" width="656" height="142" rx="18" class="panel"/><text x="58" y="494" class="tag">2:30-3:30  COMPARE</text><text x="58" y="536" class="body">Check height against width or handle opening.</text><path d="M560 478 L560 550 M550 478 L570 478 M550 550 L570 550 M590 550 L652 550 M590 542 L590 558 M652 542 L652 558" class="accent"/>
<rect x="32" y="609" width="656" height="142" rx="18" class="panel"/><text x="58" y="652" class="tag">3:30-5:30  SECOND SKETCH</text><text x="58" y="694" class="body">Change only the relation you checked.</text><g transform="translate(545 635) scale(0.32 0.35)" class="ink"><ellipse cx="76" cy="25" rx="48" ry="14"/><path d="M28 27 C29 69 28 119 38 146 C53 162 101 163 116 146 C124 116 123 66 124 27"/><path d="M122 52 C165 43 164 123 121 117"/><path d="M123 68 C145 67 145 101 122 101"/><path d="M39 143 C58 151 97 153 115 143"/></g>
<rect x="32" y="767" width="656" height="142" rx="18" class="panel"/><text x="58" y="811" class="tag">5:30-7:00  NOTE</text><text x="58" y="853" class="body">Circle the change. Keep the same view.</text><circle cx="586" cy="845" r="29" class="accent"/><path d="M571 845 L581 856 L603 830" class="accent"/>
<text x="40" y="970" class="footer">Example only: check the mug in front of you.</text></svg>